<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRRS – Conference Room Reservation System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --navy: #0d2137;
  --navy-mid: #1a3a5c;
  --navy-light: #2a5a8c;
  --accent: #3b8fd4;
  --accent-light: #e8f3fb;
  --gold: #c9a84c;
  --surface: #f4f6f9;
  --card: #ffffff;
  --border: #dde3ec;
  --border-strong: #b0bcd0;
  --text: #111827;
  --text-secondary: #4b5563;
  --text-muted: #9ca3af;
  --success: #059669;
  --success-bg: #ecfdf5;
  --warning: #d97706;
  --warning-bg: #fffbeb;
  --danger: #dc2626;
  --danger-bg: #fef2f2;
  --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: var(--font); background: var(--surface); color: var(--text); }
#root { height: 100%; }

.auth-page { min-height: 100vh; display: flex; background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 60%, #1e4d78 100%); }
.auth-center { width: 420px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; padding: 2.5rem 2rem; background: var(--card); box-shadow: 4px 0 30px rgba(0,0,0,.18); z-index: 2; }
.auth-form-box { width: 100%; }
.auth-right { flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 2.5rem; }
.auth-right-inner { color: white; max-width: 480px; width: 100%; }
.auth-logo { width: 72px; height: 72px; display: flex; align-items: center; justify-content: center; margin-bottom: 1.5rem; }
.auth-logo img { width: 72px; height: 72px; object-fit: contain; }
.auth-headline { font-size: 26px; font-weight: 700; line-height: 1.25; margin-bottom: .75rem; letter-spacing: -0.3px; color:#fff; }
.auth-headline span { color: var(--gold); }
.auth-desc { font-size: 14px; color: rgba(255,255,255,0.65); line-height: 1.65; margin-bottom: 1.5rem; }
.room-pills { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
.room-pill { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.18); border-radius: 30px; padding: 5px 12px; font-size: 12px; color: rgba(255,255,255,0.85); }
.info-cards { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
.info-card { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: .85rem 1rem; }
.info-card-icon { font-size: 20px; margin-bottom: .35rem; }
.info-card-title { font-size: 12px; font-weight: 700; color: #fff; margin-bottom: 2px; }
.info-card-sub { font-size: 11px; color: rgba(255,255,255,.5); line-height: 1.4; }
.auth-form-title { font-size: 20px; font-weight: 700; margin-bottom: .3rem; color: var(--navy); }
.auth-form-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 1.5rem; }
.field { margin-bottom: 1rem; }
.field label { display: block; font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 5px; }
.field input { width: 100%; height: 42px; padding: 0 13px; border: 1px solid var(--border); border-radius: 9px; font-size: 14px; background: #fafbfd; color: var(--text); outline: none; transition: all .15s; }
.field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,143,212,.12); }
.btn-primary { width: 100%; height: 44px; background: var(--navy); color: #fff; border: none; border-radius: 9px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s; letter-spacing: .01em; }
.btn-primary:hover { background: var(--navy-mid); }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }
.link-btn { background: none; border: none; color: var(--accent); font-size: 13px; cursor: pointer; padding: 0; text-decoration: underline; }
.divider-line { text-align: center; color: var(--text-muted); font-size: 12px; margin: 1.25rem 0; position: relative; }
.divider-line::before, .divider-line::after { content: ''; position: absolute; top: 50%; width: 42%; height: 1px; background: var(--border); }
.divider-line::before { left: 0; }
.divider-line::after { right: 0; }
.msg-box { border-radius: 9px; padding: .65rem .9rem; font-size: 13px; margin-bottom: 1rem; }
.msg-error { background: var(--danger-bg); border: 1px solid #fca5a5; color: var(--danger); }
.msg-success { background: var(--success-bg); border: 1px solid #6ee7b7; color: var(--success); }
.msg-info { background: var(--accent-light); border: 1px solid #93c5fd; color: #1d4ed8; }
.sq-card { background: var(--accent-light); border: 1px solid #93c5fd; border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }
.sq-card .sq-label { font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
.sq-card .sq-q { font-size: 14px; font-weight: 600; color: var(--navy); }
.app-shell { display: flex; height: 100vh; overflow: hidden; }
.sidebar { width: 230px; background: var(--navy); color: #fff; display: flex; flex-direction: column; flex-shrink: 0; }
.sidebar-header { padding: 1.25rem 1rem 1rem; border-bottom: 1px solid rgba(255,255,255,.08); }
.sidebar-logo { display: flex; align-items: center; gap: 9px; }
.sidebar-logo .sl-icon { width: 42px; height: 42px; border-radius: 9px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.sidebar-logo .sl-icon img { width: 42px; height: 42px; object-fit: contain; }
.sidebar-logo .sl-text h2 { font-size: 15px; font-weight: 700; }
.sidebar-logo .sl-text p { font-size: 10px; color: rgba(255,255,255,.45); text-transform: uppercase; letter-spacing: .07em; }
.sidebar-nav { flex: 1; padding: 1rem .75rem; overflow-y: auto; }
.nav-group-label { font-size: 10px; color: rgba(255,255,255,.35); text-transform: uppercase; letter-spacing: .09em; padding: 0 .5rem; margin-bottom: .4rem; margin-top: .75rem; }
.nav-item { display: flex; align-items: center; gap: 9px; padding: .55rem .75rem; border-radius: 8px; cursor: pointer; font-size: 13px; color: rgba(255,255,255,.65); transition: all .14s; width: 100%; background: none; border: none; text-align: left; }
.nav-item:hover { background: rgba(255,255,255,.07); color: #fff; }
.nav-item.active { background: rgba(59,143,212,.25); color: #fff; font-weight: 600; }
.nav-item .ni { font-size: 16px; width: 20px; text-align: center; }
.sidebar-footer { padding: .75rem; border-top: 1px solid rgba(255,255,255,.08); }
.user-chip { display: flex; align-items: center; gap: 8px; padding: .6rem .75rem; border-radius: 9px; background: rgba(255,255,255,.06); overflow: hidden; }
.uc-av { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
.uc-info p { font-size: 12px; font-weight: 500; line-height: 1.2; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px; }
.uc-info span { font-size: 10px; color: rgba(255,255,255,.45); }
.logout-btn { display: flex; align-items: center; gap: 6px; margin-top: .4rem; width: 100%; background: none; border: none; color: rgba(255,255,255,.4); font-size: 12px; cursor: pointer; padding: .35rem .5rem; border-radius: 6px; }
.logout-btn:hover { color: rgba(255,255,255,.8); background: rgba(255,255,255,.05); }
.main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar { background: var(--card); border-bottom: 1px solid var(--border); padding: .9rem 1.5rem; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.topbar-title { font-size: 16px; font-weight: 700; color: var(--navy); }
.topbar-sub { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
.topbar-right { display: flex; align-items: center; gap: .6rem; }
.content-area { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 1.5rem; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all .14s; border: 1px solid var(--border); background: var(--card); color: var(--text); }
.btn:hover { background: var(--surface); }
.btn.btn-navy { background: var(--navy); color: #fff; border-color: var(--navy); }
.btn.btn-navy:hover { background: var(--navy-mid); }
.btn.btn-danger { background: var(--danger-bg); color: var(--danger); border-color: #fca5a5; }
.btn.btn-success { background: var(--success-bg); color: var(--success); border-color: #6ee7b7; }
.btn.btn-sm { height: 28px; padding: 0 10px; font-size: 11px; border-radius: 6px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.room-type-section { margin-bottom: 1.5rem; }
.section-heading { font-size: 13px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .07em; margin-bottom: .75rem; }
.rooms-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
.room-card { background: var(--card); border: 2px solid var(--border); border-radius: 14px; padding: 1.25rem; cursor: pointer; transition: all .15s; position: relative; }
.room-card:hover { border-color: var(--accent); box-shadow: 0 4px 16px rgba(59,143,212,.1); transform: translateY(-1px); }
.room-card.selected { border-color: var(--navy); background: #f0f5fb; }
.room-card.selected::after { content: '✓'; position: absolute; top: .75rem; right: .75rem; width: 22px; height: 22px; background: var(--navy); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
.room-type-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 20px; text-transform: uppercase; letter-spacing: .05em; margin-bottom: .75rem; }
.badge-big { background: #e8f3fb; color: var(--navy-mid); }
.badge-small { background: #e8f5ee; color: #166534; }
.room-name { font-size: 16px; font-weight: 700; margin-bottom: .4rem; color: var(--navy); }
.room-meta-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: .5rem; }
.room-meta-item { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 4px; }
.booking-panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.5rem; }
.panel-title { font-size: 16px; font-weight: 700; color: var(--navy); margin-bottom: 1.25rem; display: flex; align-items: center; gap: 8px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.form-field { display: flex; flex-direction: column; gap: 5px; }
.form-field.full { grid-column: 1/-1; }
.form-label { font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .05em; }
.form-input { border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 13px; background: #fafbfd; color: var(--text); outline: none; font-family: inherit; transition: all .14s; }
.form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,143,212,.1); }
.form-input[disabled] { background: #f0f2f5; color: var(--text-muted); cursor: not-allowed; }
.form-hint { font-size: 11px; color: var(--text-muted); }
.form-actions { display: flex; gap: .75rem; margin-top: 1.25rem; justify-content: flex-end; }
.table-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: visible; }
.table-card-header { padding: .85rem 1.25rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.table-card-title { font-size: 14px; font-weight: 700; color: var(--navy); }
table.data-table { width: 100%; border-collapse: collapse; min-width: 700px; }
table.data-table th { text-align: left; font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; padding: .5rem 1rem; background: #f8fafc; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.data-table td { padding: .6rem 1rem; font-size: 12px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: middle; }
table.data-table tr:last-child td { border-bottom: none; }
table.data-table tr:hover td { background: #f8fafc; }
.status-pill { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; text-transform: capitalize; white-space: nowrap; }
.pill-pending { background: var(--warning-bg); color: var(--warning); }
.pill-approved { background: var(--success-bg); color: var(--success); }
.pill-declined { background: var(--danger-bg); color: var(--danger); }
.pill-cancelled { background: #f3f4f6; color: var(--text-muted); }
.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: .85rem; margin-bottom: 1.25rem; }
.stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.1rem; }
.stat-label { font-size: 11px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: .05em; margin-bottom: .35rem; }
.stat-value { font-size: 26px; font-weight: 800; color: var(--navy); line-height: 1; }
.stat-sub { font-size: 11px; color: var(--text-secondary); margin-top: .25rem; }
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 1rem; }
.modal { background: var(--card); border-radius: 16px; padding: 1.75rem; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
.modal-title { font-size: 18px; font-weight: 700; color: var(--navy); margin-bottom: .35rem; }
.modal-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 1.5rem; }
.modal-actions { display: flex; gap: .75rem; margin-top: 1.5rem; justify-content: flex-end; }
.toast-container { position: fixed; top: 1rem; right: 1rem; z-index: 9999; display: flex; flex-direction: column; gap: .5rem; pointer-events: none; }
.toast { padding: .75rem 1rem; border-radius: 10px; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 20px rgba(0,0,0,.12); pointer-events: all; animation: slideIn .25s ease; max-width: 320px; }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.toast-success { background: var(--success-bg); border: 1px solid #6ee7b7; color: var(--success); }
.toast-error { background: var(--danger-bg); border: 1px solid #fca5a5; color: var(--danger); }
.toast-info { background: var(--accent-light); border: 1px solid #93c5fd; color: #1d4ed8; }
.spinner { width: 18px; height: 18px; border: 2px solid transparent; border-top-color: currentColor; border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-muted); }
.empty-state .es-icon { font-size: 40px; margin-bottom: .75rem; }
.empty-state p { font-size: 14px; }
.empty-state .es-sub { font-size: 12px; margin-top: .3rem; }

/* ─── ROOM SCHEDULE / CALENDAR ─── */
.sched-toolbar { display: flex; align-items: center; gap: .6rem; margin-bottom: 1.1rem; flex-wrap: wrap; }
.sched-date-nav { display: flex; align-items: center; gap: .4rem; }
.sched-date-nav input[type="date"] { height: 36px; border: 1px solid var(--border); border-radius: 8px; padding: 0 10px; font-size: 13px; background: #fafbfd; }
.sched-room-tabs { display: flex; gap: .4rem; flex-wrap: wrap; }
.sched-legend { display: flex; gap: 1rem; margin-left: auto; font-size: 11px; color: var(--text-secondary); align-items: center; }
.sched-legend-item { display: flex; align-items: center; gap: 5px; }
.sched-dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.sched-board { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
.sched-room-block { border-bottom: 1px solid var(--border); }
.sched-room-block:last-child { border-bottom: none; }
.sched-room-head { padding: .75rem 1.1rem; background: #f8fafc; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.sched-room-head-title { font-size: 13px; font-weight: 700; color: var(--navy); display: flex; align-items: center; gap: 8px; }
.sched-room-head-meta { font-size: 11px; color: var(--text-muted); }
.sched-grid-wrap { overflow-x: auto; }
.sched-grid { position: relative; min-width: 960px; padding: .9rem 1.1rem 1.1rem; }
.sched-ruler { display: flex; border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-bottom: 10px; position: relative; }
.sched-ruler-tick { flex: 1; font-size: 10px; color: var(--text-muted); text-align: left; position: relative; }
.sched-track { position: relative; height: 56px; background: repeating-linear-gradient(to right, #f3f5f8 0, #f3f5f8 1px, transparent 1px, transparent calc(100%/24)); border-radius: 8px; }
.sched-slot { position: absolute; top: 6px; bottom: 6px; border-radius: 7px; padding: 5px 9px; font-size: 11px; overflow: hidden; cursor: pointer; border: 1px solid; transition: transform .12s, box-shadow .12s; }
.sched-slot:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(0,0,0,.15); z-index: 5; }
.sched-slot.s-pending { background: var(--warning-bg); border-color: #fbbf6b; color: #92400e; }
.sched-slot.s-approved { background: var(--danger-bg); border-color: #f59999; color: #991b1b; }
.sched-slot-time { font-weight: 700; white-space: nowrap; }
.sched-slot-who { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .9; }
.sched-empty-row { padding: 1.5rem 1.1rem; text-align: center; color: var(--text-muted); font-size: 12px; }
.occ-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 800; padding: 2px 9px; border-radius: 20px; text-transform: uppercase; letter-spacing: .05em; }
.occ-tag.occupied { background: var(--danger-bg); color: var(--danger); }
.occ-tag.tentative { background: var(--warning-bg); color: var(--warning); }
.occ-tag.free { background: var(--success-bg); color: var(--success); }
.sched-detail-list { margin-top: 1.25rem; }


@media (max-width: 768px) {
  .auth-right { width: 100%; }
  .sidebar { width: 200px; }
  .stats-row { grid-template-columns: 1fr 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  .db-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ─── SUPABASE CONNECTION (live) ───
// This app talks directly to a real Supabase project — there is no
// local/demo data layer anymore. Every supabase.auth.* and
// supabase.from(...) call below hits your actual Postgres database.
const SUPABASE_URL = 'https://ryqfpwmdcntbceisjryc.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5cWZwd21kY250YmNlaXNqcnljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2OTAyMjUsImV4cCI6MjA5ODI2NjIyNX0.enugYh1hKAaWOL9lOFhkGYi3NF-Rad6WcLe3iWDLlA0';
// persistSession/autoRefreshToken are disabled on purpose: this is a shared-computer app,
// so we never want Supabase to silently auto-restore a previous person's login from
// browser storage. Every visit requires a fresh, explicit sign-in.
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }

// ─── TOAST ───
function ToastContainer({ toasts, remove }) {
  return (
    <div className="toast-container">
      {toasts.map(t => (
        <div key={t.id} className={`toast toast-${t.type}`} onClick={() => remove(t.id)}>
          <span>{t.type === 'success' ? '✓' : t.type === 'error' ? '✕' : 'ℹ'}</span>
          {t.msg}
        </div>
      ))}
    </div>
  );
}

function useToast() {
  const [toasts, setToasts] = useState([]);
  const add = useCallback((msg, type = 'info') => {
    const id = Date.now();
    setToasts(p => [...p, { id, msg, type }]);
    setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 4000);
  }, []);
  const remove = useCallback(id => setToasts(p => p.filter(t => t.id !== id)), []);
  return { toasts, add, remove };
}

// ─── PASSWORD VALIDATION ───
function validatePassword(pw) {
  if (pw.length < 8) return 'Password must be at least 8 characters.';
  if (!/[A-Z]/.test(pw)) return 'Password must have at least one uppercase letter.';
  if (!/[0-9]/.test(pw)) return 'Password must have at least one number.';
  if (!/[^A-Za-z0-9]/.test(pw)) return 'Password must have at least one special character.';
  return null;
}

// ─── TIME VALIDATION ───
function isValidTimeRange(from, to) {
  if (!from || !to) return false;
  const [fh, fm] = from.split(':').map(Number);
  const [th, tm] = to.split(':').map(Number);
  return fh * 60 + fm < th * 60 + tm;
}

// ─── TIME OVERLAP CHECK ───
function timesOverlap(from1, to1, from2, to2) {
  const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
  const s1 = toMin(from1), e1 = toMin(to1), s2 = toMin(from2), e2 = toMin(to2);
  return s1 < e2 && s2 < e1;
}

// ─── REGISTER SCREEN ───
function RegisterScreen({ onBack, onSuccess, toast }) {
  const [form, setForm] = useState({ fullName: '', email: '', password: '', confirmPw: '', secretQuestion: SECRET_QUESTIONS[0], secretAnswer: '' });
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);
  const set = k => e => setForm(p => ({ ...p, [k]: e.target.value }));

  const submit = async () => {
    setError('');
    if (!form.fullName.trim() || !form.email.trim() || !form.password || !form.secretAnswer.trim()) return setError('All fields are required.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email)) return setError('Enter a valid email address.');
    const pwErr = validatePassword(form.password);
    if (pwErr) return setError(pwErr);
    if (form.password !== form.confirmPw) return setError('Passwords do not match.');
    setLoading(true);
    try {
      // Registration (including the duplicate email/username check) is handled by a
      // server-side function. Client-side supabase.auth.signUp() can't be trusted for
      // this: with email confirmations on, Supabase deliberately returns a fake
      // success for an already-registered email (to prevent user enumeration), so a
      // duplicate signup would otherwise silently "succeed" without creating an
      // account or warning the user.
      const res = await fetch(`${SUPABASE_URL}/functions/v1/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
        body: JSON.stringify({ fullName: form.fullName.trim(), email: form.email.trim(), password: form.password, secretQuestion: form.secretQuestion, secretAnswer: form.secretAnswer }),
      });
      const result = await res.json();
      if (!res.ok) throw new Error(result.error || 'Registration failed.');
      toast('Account created! Please sign in.', 'success');
      onSuccess({ email: form.email, password: form.password });
    } catch (e) { setError(e.message || 'Registration failed.'); }
    setLoading(false);
  };

  return (
    <div>
      <h2 className="auth-form-title">Create account</h2>
      <p className="auth-form-sub">Fill in your details to get started</p>
      {error && <div className="msg-box msg-error">{error}</div>}
      <div className="field"><label>Full Name</label><input value={form.fullName} onChange={set('fullName')} placeholder="Your full name" /></div>
      <div className="field"><label>Email Address</label><input type="email" value={form.email} onChange={set('email')} placeholder="you@company.com" autoComplete="off" data-lpignore="true" data-1p-ignore="true" /></div>
      <div className="field"><label>Password</label><input type="password" value={form.password} onChange={set('password')} placeholder="Min 8 chars, uppercase, number, symbol" autoComplete="off" data-lpignore="true" data-1p-ignore="true" /></div>
      <div className="field"><label>Confirm Password</label><input type="password" value={form.confirmPw} onChange={set('confirmPw')} placeholder="Repeat password" autoComplete="off" data-lpignore="true" data-1p-ignore="true" /></div>
      <div className="field">
        <label>Security Question</label>
        <select className="form-input" value={form.secretQuestion} onChange={set('secretQuestion')} style={{height:42,fontFamily:'inherit'}}>
          {SECRET_QUESTIONS.map(q => <option key={q} value={q}>{q}</option>)}
        </select>
      </div>
      <div className="field"><label>Secret Answer</label><input value={form.secretAnswer} onChange={set('secretAnswer')} placeholder="Your answer (case-insensitive)" /></div>
      <button className="btn-primary" onClick={submit} disabled={loading}>
        {loading ? <span className="spinner" style={{borderTopColor:'#fff'}} /> : 'Create Account'}
      </button>
      <div className="divider-line">or</div>
      <button className="link-btn" style={{display:'block',textAlign:'center',width:'100%'}} onClick={onBack}>Back to Sign In</button>
    </div>
  );
}

// ─── FORGOT PASSWORD SCREEN ───
function ForgotPasswordScreen({ onBack, toast }) {
  const [step, setStep] = useState(1);
  const [email, setEmail] = useState('');
  const [answer, setAnswer] = useState('');
  const [newPw, setNewPw] = useState('');
  const [confirmPw, setConfirmPw] = useState('');
  const [foundUser, setFoundUser] = useState(null);
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  // All three steps below call a server-side edge function instead of talking to
  // Supabase directly. This fixes two problems with the old client-only approach:
  // 1. supabase.auth.updateUser() requires an active, signed-in session. A user
  //    recovering a forgotten password has no session, so the update silently
  //    failed with "Auth session missing" every time — this was the reset bug.
  // 2. The old code fetched the full user row (including secret_answer) to the
  //    browser just to compare it client-side, which leaks the answer to anyone
  //    inspecting network traffic. The answer is now verified server-side only.
  const step1 = async () => {
    setError('');
    if (!email.trim()) return setError('Enter your email address.');
    setLoading(true);
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/forgot-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
        body: JSON.stringify({ action: 'lookup', email: email.trim() }),
      });
      const result = await res.json();
      if (!res.ok) throw new Error(result.error || 'No account found with that email.');
      setFoundUser({ question: result.question });
      setStep(2);
    } catch (e) { setError(e.message); }
    setLoading(false);
  };

  const step2 = () => {
    setError('');
    if (!answer.trim()) return setError('Enter your answer.');
    // The answer itself is verified server-side in step3 (we no longer have it
    // client-side to compare against) — this just requires something be typed
    // before moving on to setting a new password.
    setStep(3);
  };

  const step3 = async () => {
    setError('');
    const pwErr = validatePassword(newPw);
    if (pwErr) return setError(pwErr);
    if (newPw !== confirmPw) return setError('Passwords do not match.');
    setLoading(true);
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/forgot-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
        body: JSON.stringify({ action: 'reset', email: email.trim(), secretAnswer: answer, newPassword: newPw }),
      });
      const result = await res.json();
      if (!res.ok) {
        // An incorrect answer is only discovered here now (verified server-side).
        // Send the user back to step 2 to try again rather than losing their progress.
        if (res.status === 401) { setStep(2); }
        throw new Error(result.error || 'Failed to update password.');
      }
      toast('Password updated! Please sign in.', 'success');
      onBack();
    } catch (e) { setError(e.message || 'Failed to update password.'); }
    setLoading(false);
  };

  return (
    <div>
      <h2 className="auth-form-title">Reset Password</h2>
      <p className="auth-form-sub">Step {step} of 3 – {step===1?'Verify your email':step===2?'Answer your security question':'Set new password'}</p>
      {error && <div className="msg-box msg-error">{error}</div>}
      {step === 1 && (<><div className="field"><label>Email Address</label><input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="you@company.com" autoComplete="off" data-lpignore="true" data-1p-ignore="true" /></div><button className="btn-primary" onClick={step1} disabled={loading}>{loading ? <span className="spinner" style={{borderTopColor:'#fff'}} /> : 'Find Account'}</button></>)}
      {step === 2 && foundUser && (<><div className="sq-card"><div className="sq-label">Your security question</div><div className="sq-q">{foundUser.question}</div></div><div className="field"><label>Your Answer</label><input value={answer} onChange={e => setAnswer(e.target.value)} placeholder="Case-insensitive" onKeyDown={e => e.key==='Enter' && step2()} /></div><button className="btn-primary" onClick={step2}>Verify Answer</button></>)}
      {step === 3 && (<><div className="msg-box msg-info">✓ Identity verified. Set your new password below.</div><div className="field"><label>New Password</label><input type="password" value={newPw} onChange={e => setNewPw(e.target.value)} placeholder="Min 8 chars, uppercase, number, symbol" autoComplete="off" data-lpignore="true" data-1p-ignore="true" /></div><div className="field"><label>Confirm New Password</label><input type="password" value={confirmPw} onChange={e => setConfirmPw(e.target.value)} placeholder="Repeat new password" autoComplete="off" data-lpignore="true" data-1p-ignore="true" /></div><button className="btn-primary" onClick={step3} disabled={loading}>{loading ? <span className="spinner" style={{borderTopColor:'#fff'}} /> : 'Update Password'}</button></>)}
      <div className="divider-line">or</div>
      <button className="link-btn" style={{display:'block',textAlign:'center',width:'100%'}} onClick={onBack}>Back to Sign In</button>
    </div>
  );
}

// Wipes any credential/session data that should never persist in browser storage.
function clearStoredCredentials() {
  try {
    // Legacy keys from the old "remember me" auto-fill feature — always removed.
    localStorage.removeItem('crrs_saved_email');
    localStorage.removeItem('crrs_saved_pw');
    sessionStorage.removeItem('crrs_saved_email');
    sessionStorage.removeItem('crrs_saved_pw');
    // Legacy key from the old cross-account "single user for the whole system"
    // lock — no longer used, since the lock is now scoped per-account (see
    // claim_active_session in the DB). Removed here too so it doesn't linger.
    localStorage.removeItem('crrs_active_session_lock');
  } catch (e) {}
}

// ─── DATABASE-BACKED PER-ACCOUNT SINGLE-SESSION LOCK ───
// Checks the `users` table so that a given ACCOUNT (email address) can only be
// signed in from one browser/device at a time. Different accounts are free to
// be signed in simultaneously from different devices — this only traps the
// SAME email address trying to sign in a second time while its first session
// is still active.
// Requires the migration in migration_active_sessions.sql to be run first:
//   users.is_active boolean, users.last_active_at timestamptz, users.active_device text
//   + the claim_active_session(...) function (does the check atomically, avoiding
//     race conditions if the same account tries to log in twice at nearly the same moment).
const DB_SESSION_STALE_MS = 15 * 60 * 1000;   // a session with no heartbeat for 15 min is considered abandoned/inactive and is auto-removed
const DB_SESSION_STALE_SECONDS = DB_SESSION_STALE_MS / 1000;
const DB_SESSION_HEARTBEAT_MS = 90 * 1000;    // refresh "still active" every 90 sec while signed in
const DB_SESSION_SWEEP_MS = 60 * 1000;        // how often we proactively check the DB for stale sessions to auto-remove

function getDeviceLabel() {
  try {
    const ua = navigator.userAgent || '';
    let browser = 'Browser';
    if (/Edg\//.test(ua)) browser = 'Edge';
    else if (/Chrome\//.test(ua) && !/Chromium/.test(ua)) browser = 'Chrome';
    else if (/Firefox\//.test(ua)) browser = 'Firefox';
    else if (/Safari\//.test(ua) && !/Chrome/.test(ua)) browser = 'Safari';
    let os = 'device';
    if (/Windows/.test(ua)) os = 'Windows';
    else if (/Mac OS X/.test(ua)) os = 'Mac';
    else if (/Android/.test(ua)) os = 'Android';
    else if (/iPhone|iPad/.test(ua)) os = 'iOS';
    else if (/Linux/.test(ua)) os = 'Linux';
    return `${browser} on ${os}`;
  } catch (e) { return 'Unknown device'; }
}

function timeAgo(iso) {
  if (!iso) return 'a while ago';
  const mins = Math.max(1, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  if (mins < 60) return `${mins} minute${mins === 1 ? '' : 's'} ago`;
  const hrs = Math.round(mins / 60);
  return `${hrs} hour${hrs === 1 ? '' : 's'} ago`;
}

// Asks the database, atomically, whether THIS account may sign in. Blocks only if
// this same account is already active elsewhere (another browser/device) and its
// session hasn't gone stale. Other accounts being active has no effect here.
async function claimDbSession(userId) {
  try {
    const { data, error } = await supabase.rpc('claim_active_session', {
      p_user_id: userId,
      p_device: getDeviceLabel(),
      p_stale_seconds: DB_SESSION_STALE_SECONDS,
    });
    const result = Array.isArray(data) ? data[0] : data;
    if (error || !result) {
      console.warn('Active-session check failed, allowing sign-in:', error?.message);
      return { claimed: true };
    }
    if (!result.claimed) {
      return {
        claimed: false,
        activeInfo: {
          full_name: result.active_full_name,
          email: result.active_email,
          active_device: result.active_device,
          last_active_at: result.active_last_active_at,
        },
      };
    }
    return { claimed: true };
  } catch (e) {
    // If the RPC isn't set up yet, fail safe by allowing sign-in rather than locking
    // everyone out — but log it so it's visible that the migration still needs to run.
    console.warn('Active-session check failed, allowing sign-in:', e.message);
    return { claimed: true };
  }
}

async function releaseDbSession(userId) {
  try { await supabase.from('users').update({ is_active: false }).eq('id', userId); } catch (e) {}
}

// Proactively auto-removes any logged-in user/admin whose session has gone silent
// (no heartbeat) for longer than DB_SESSION_STALE_MS, by flipping is_active back to
// false in the database directly — rather than only reclaiming it lazily the next
// time someone tries to log back in with those same credentials. Runs on an interval
// from any signed-in client, so the DB (and the admin's Active Sessions view) reflects
// the 15-minute inactivity rule on its own.
async function sweepStaleSessions() {
  try {
    const cutoff = new Date(Date.now() - DB_SESSION_STALE_MS).toISOString();
    await supabase.from('users').update({ is_active: false }).eq('is_active', true).lt('last_active_at', cutoff);
  } catch (e) {}
}

// Same effect as releaseDbSession, but uses a raw `fetch` with `keepalive: true` instead
// of the normal Supabase client call. Browsers can abort in-flight requests the instant a
// tab closes; a keepalive fetch is specifically designed to survive that and still be sent.
// Must be called synchronously (not awaited) from a 'pagehide'/'beforeunload' handler.
function releaseDbSessionBeacon(userId, accessToken) {
  if (!userId) return;
  try {
    fetch(`${SUPABASE_URL}/rest/v1/users?id=eq.${encodeURIComponent(userId)}`, {
      method: 'PATCH',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${accessToken || SUPABASE_ANON_KEY}`,
        'Prefer': 'return=minimal',
      },
      body: JSON.stringify({ is_active: false }),
      keepalive: true,
    }).catch(() => {});
  } catch (e) {}
}

async function heartbeatDbSession(userId) {
  try { await supabase.from('users').update({ last_active_at: new Date().toISOString() }).eq('id', userId).eq('is_active', true); } catch (e) {}
}

function LoginScreen({ onLogin, toast }) {
  const [screen, setScreen] = useState('login');
  // Fields always start blank — no credentials are ever auto-filled from storage.
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  // Clear any leftover credential data the moment the login screen mounts.
  useEffect(() => {
    clearStoredCredentials();
  }, []);

  const login = async () => {
    setError('');
    const emailToLogin = email.trim();
    const passwordToLogin = password;
    if (!emailToLogin || !passwordToLogin) return setError('Email and password are required.');

    // Clear the visible Sign In fields as soon as an attempt starts (not just on
    // success), so the credentials don't linger in the inputs while the request
    // is in flight. The values needed for the actual sign-in call were already
    // captured above.
    setEmail('');
    setPassword('');

    setLoading(true);
    // Wipe any lingering credential data before attempting sign-in.
    clearStoredCredentials();
    try {
      const { data, error: authErr } = await supabase.auth.signInWithPassword({ email: emailToLogin, password: passwordToLogin });
      if (authErr) throw authErr;
      const { data: profile } = await supabase.from('users').select('*').eq('id', data.user.id).single();
      const user = {
        id: data.user.id,
        fullName: profile?.full_name || data.user.email,
        email: data.user.email,
        role: profile?.role || 'user',
        accessToken: data.session?.access_token || null, // kept in memory only, used for a reliable release on tab close
      };

      // Database-level check: THIS account (this email address) can only be active
      // on one browser/device at a time. Other accounts logging in elsewhere have
      // no effect on this check.
      const claim = await claimDbSession(user.id);
      if (!claim.claimed) {
        await supabase.auth.signOut();
        const info = claim.activeInfo;
        setError(
          `This account is already signed in on ${info?.active_device || 'another device'}${info?.last_active_at ? `, last active ${timeAgo(info.last_active_at)}` : ''}. Please sign out there first — the same email address can't be signed in twice at once.`
        );
        return;
      }

      // Never store credentials.
      clearStoredCredentials();
      onLogin(user);
      toast(`Welcome back, ${user.fullName.split(' ')[0]}!`, 'success');
    } catch (e) {
      setError(e.message || 'Sign in failed.');
    } finally {
      // Always clear credential storage after a sign-in attempt, success or failure.
      clearStoredCredentials();
      setLoading(false);
    }
  };

  if (screen === 'register') return (
    <div className="auth-page">
      <div className="auth-center"><div className="auth-form-box">
        <RegisterScreen onBack={() => setScreen('login')} onSuccess={(creds) => { if(creds) { setEmail(creds.email); setPassword(creds.password); } setScreen('login'); }} toast={toast} />
      </div></div>
      <div className="auth-right"><div className="auth-right-inner">
        <div className="auth-logo"><img src={LOGO_SRC} alt="Logo" /></div>
        <h1 className="auth-headline">Create your <span>account</span></h1>
        <p className="auth-desc">Register to start booking Training Rooms and Meeting Rooms. Set up a security question for account recovery.</p>
        <div className="info-cards">
          <div className="info-card"><div className="info-card-icon">🔐</div><div className="info-card-title">Secure Access</div><div className="info-card-sub">Your account is protected with password requirements and a secret security question</div></div>
          <div className="info-card"><div className="info-card-icon">📋</div><div className="info-card-title">Track Bookings</div><div className="info-card-sub">View all your reservations and their approval status in real time</div></div>
        </div>
      </div></div>
    </div>
  );

  if (screen === 'forgot') return (
    <div className="auth-page">
      <div className="auth-center"><div className="auth-form-box">
        <ForgotPasswordScreen onBack={() => setScreen('login')} toast={toast} />
      </div></div>
      <div className="auth-right"><div className="auth-right-inner">
        <div className="auth-logo"><img src={LOGO_SRC} alt="Logo" /></div>
        <h1 className="auth-headline">Reset your <span>password</span></h1>
        <p className="auth-desc">Verify your email, answer your secret question, then set a new strong password.</p>
        <div className="info-cards">
          <div className="info-card"><div className="info-card-icon">📧</div><div className="info-card-title">Step 1 – Email</div><div className="info-card-sub">Enter the email address registered to your account</div></div>
          <div className="info-card"><div className="info-card-icon">🔑</div><div className="info-card-title">Step 2 – Question</div><div className="info-card-sub">Answer your pre-set security question to verify your identity</div></div>
          <div className="info-card"><div className="info-card-icon">🛡</div><div className="info-card-title">Step 3 – New Password</div><div className="info-card-sub">Set a strong new password</div></div>
          <div className="info-card"><div className="info-card-icon">✅</div><div className="info-card-title">All Done</div><div className="info-card-sub">Password updated. Sign in with your new credentials.</div></div>
        </div>
      </div></div>
    </div>
  );

  return (
    <div className="auth-page">
      <div className="auth-center">
        <div className="auth-form-box">
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:'1.5rem'}}>
            <img src={LOGO_SRC} alt="Logo" style={{width:44,height:44,objectFit:'contain'}} />
            <div><div style={{fontSize:14,fontWeight:700,color:'var(--navy)',lineHeight:1.1}}>CRRS</div><div style={{fontSize:10,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'.06em'}}>Room Reservation System</div></div>
          </div>
          <h2 className="auth-form-title">Sign in</h2>
          <p className="auth-form-sub">Enter your credentials to access the system</p>
          {error && <div className="msg-box msg-error">{error}</div>}
          <div className="field"><label>Email Address</label><input type="email" name="crrs_email_field" value={email} onChange={e => setEmail(e.target.value)} placeholder="you@company.com" onKeyDown={e => e.key==='Enter' && login()} autoComplete="off" data-lpignore="true" data-1p-ignore="true" /></div>
          <div className="field"><label>Password</label><input type="password" name="crrs_password_field" value={password} onChange={e => setPassword(e.target.value)} placeholder="••••••••" onKeyDown={e => e.key==='Enter' && login()} autoComplete="off" data-lpignore="true" data-1p-ignore="true" /></div>
          <div style={{display:'flex',alignItems:'center',justifyContent:'flex-end',marginBottom:'1rem',marginTop:'-.25rem'}}>
            <button className="link-btn" onClick={() => setScreen('forgot')}>Forgot password?</button>
          </div>
          <button className="btn-primary" onClick={login} disabled={loading}>
            {loading ? <><span className="spinner" style={{borderTopColor:'#fff'}} /> Signing in…</> : 'Sign In'}
          </button>
          <div className="divider-line">don't have an account?</div>
          <button className="btn-primary" style={{background:'transparent',color:'var(--navy)',border:'1px solid var(--border-strong)'}} onClick={() => setScreen('register')}>Create Account</button>
        </div>
      </div>
      <div className="auth-right">
        <div className="auth-right-inner">
          <div className="auth-logo"><img src={LOGO_SRC} alt="Logo" /></div>
          <h1 className="auth-headline">Conference Room <span>Reservation System</span></h1>
          <p className="auth-desc">Book the Training Room or Meeting Room with ease. All reservations go through admin approval.</p>
          <div className="room-pills">
            <div className="room-pill">🎓 Training Room (up to 16)</div>
            <div className="room-pill">🤝 Meeting Room (up to 10)</div>
            <div className="room-pill">✅ Admin Approval</div>
            <div className="room-pill">📍 5th Floor</div>
          </div>
          <div className="info-cards">
            <div className="info-card"><div className="info-card-icon">🎓</div><div className="info-card-title">Training Room</div><div className="info-card-sub">Display, interactive panel, video conference — up to 16 people, 5th floor</div></div>
            <div className="info-card"><div className="info-card-icon">🤝</div><div className="info-card-title">Meeting / Committee Room</div><div className="info-card-sub">White board, executive meetings — up to 10 people, 5th floor</div></div>
            <div className="info-card"><div className="info-card-icon">⏱</div><div className="info-card-title">24-Hour Time</div><div className="info-card-sub">All booking times use military format — 09:00, 14:30, 17:00</div></div>
            <div className="info-card"><div className="info-card-icon">🚫</div><div className="info-card-title">No Double Booking</div><div className="info-card-sub">Overlapping schedules for the same room and date are automatically blocked</div></div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── ROOM SCHEDULE / CALENDAR ───
function RoomSchedule({ rooms, toast, isAdmin }) {
  const today = new Date().toISOString().split('T')[0];
  const [date, setDate] = useState(today);
  const [reservations, setReservations] = useState([]);
  const [loading, setLoading] = useState(true);
  const [activeSlot, setActiveSlot] = useState(null);

  const load = useCallback(async () => {
    setLoading(true);
    try {
      const { data, error } = await supabase.from('reservations').select('*').eq('date', date).in('status', ['pending', 'approved']);
      if (error) throw error;
      setReservations(data || []);
    } catch (e) { toast(e.message || 'Failed to load schedule.', 'error'); }
    setLoading(false);
  }, [date]);

  useEffect(() => { load(); }, [load]);

  // ─── REALTIME: auto-reload schedule when any reservation changes ───
  useEffect(() => {
    const channel = supabase
      .channel('room-schedule-realtime')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'reservations' }, () => { load(); })
      .subscribe();
    return () => { supabase.removeChannel(channel); };
  }, [load]);

  const shiftDate = days => {
    const d = new Date(date + 'T00:00:00');
    d.setDate(d.getDate() + days);
    setDate(d.toISOString().split('T')[0]);
  };

  const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + (m || 0); };
  const fmtTime = t => (t || '').slice(0, 5);
  const HOUR_START = 6, HOUR_END = 21; // 6 AM – 9 PM window
  const totalMin = (HOUR_END - HOUR_START) * 60;

  const slotStyle = r => {
    const s = Math.max(toMin(r.time_from), HOUR_START * 60);
    const e = Math.min(toMin(r.time_to), HOUR_END * 60);
    const left = ((s - HOUR_START * 60) / totalMin) * 100;
    const width = ((e - s) / totalMin) * 100;
    return { left: `${left}%`, width: `${Math.max(width, 2)}%` };
  };

  const hourTicks = [];
  for (let h = HOUR_START; h <= HOUR_END; h++) hourTicks.push(h);

  const formattedDate = new Date(date + 'T00:00:00').toLocaleDateString('en-PH', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

  return (
    <div>
      <div className="sched-toolbar">
        <div className="sched-date-nav">
          <button className="btn btn-sm" onClick={() => shiftDate(-1)}>‹ Prev</button>
          <input type="date" value={date} onChange={e => setDate(e.target.value)} />
          <button className="btn btn-sm" onClick={() => shiftDate(1)}>Next ›</button>
          <button className="btn btn-sm" onClick={() => setDate(today)}>Today</button>
        </div>
        <div className="sched-legend">
          <span className="sched-legend-item"><span className="sched-dot" style={{background:'var(--danger)'}} /> Approved / Occupied</span>
          <span className="sched-legend-item"><span className="sched-dot" style={{background:'var(--warning)'}} /> Pending</span>
          <button className="btn btn-sm" onClick={load} style={{marginLeft:'auto'}}>↻ Refresh</button>
          <span style={{fontSize:10,fontWeight:700,background:'#ecfdf5',color:'#059669',border:'1px solid #6ee7b7',borderRadius:20,padding:'2px 8px'}}>● LIVE</span>
        </div>
      </div>

      <div style={{fontSize:13, fontWeight:600, color:'var(--navy)', marginBottom:'.75rem'}}>{formattedDate}</div>

      {loading ? (
        <div style={{padding:'2rem',textAlign:'center'}}><span className="spinner" /></div>
      ) : (
        <div className="sched-board">
          {rooms.map(room => {
            const roomRes = reservations.filter(r => r.room_id === room.id).sort((a,b) => toMin(a.time_from) - toMin(b.time_from));
            const isOccupiedNow = (() => {
              if (date !== today) return null;
              const now = new Date();
              const nowMin = now.getHours() * 60 + now.getMinutes();
              return roomRes.some(r => r.status === 'approved' && nowMin >= toMin(r.time_from) && nowMin < toMin(r.time_to));
            })();

            return (
              <div className="sched-room-block" key={room.id}>
                <div className="sched-room-head">
                  <div className="sched-room-head-title">
                    {room.type === 'big' ? '🎓' : '🤝'} {room.name}
                    {date === today && (
                      isOccupiedNow
                        ? <span className="occ-tag occupied">● Occupied Now</span>
                        : <span className="occ-tag free">○ Free Now</span>
                    )}
                  </div>
                  <div className="sched-room-head-meta">{roomRes.length} booking{roomRes.length !== 1 ? 's' : ''} today</div>
                </div>
                <div className="sched-grid-wrap">
                  <div className="sched-grid">
                    <div className="sched-ruler">
                      {hourTicks.map(h => (
                        <div className="sched-ruler-tick" key={h} style={{flex: h === HOUR_END ? '0 0 0' : 1}}>
                          {h % 12 === 0 ? 12 : h % 12}{h < 12 ? 'AM' : 'PM'}
                        </div>
                      ))}
                    </div>
                    <div className="sched-track">
                      {roomRes.length === 0 && (
                        <div style={{position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center', color:'var(--text-muted)', fontSize:11}}>
                          No reservations — room free all day
                        </div>
                      )}
                      {roomRes.map(r => (
                        <div
                          key={r.id}
                          className={`sched-slot ${r.status === 'approved' ? 's-approved' : 's-pending'}`}
                          style={slotStyle(r)}
                          onClick={() => setActiveSlot(r)}
                          title={`${fmtTime(r.time_from)}–${fmtTime(r.time_to)} · ${r.user_full_name}`}
                        >
                          <div className="sched-slot-time">{fmtTime(r.time_from)}–{fmtTime(r.time_to)}</div>
                          <div className="sched-slot-who">{r.user_full_name}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {!loading && (
        <div className="sched-detail-list">
          <div className="table-card">

// ─── BOOKING FORM ───
function BookingForm({ currentUser, rooms, onBooked, toast }) {
  const today = new Date().toISOString().split('T')[0];
  const [selectedRoom, setSelectedRoom] = useState(null);
  const [filterType, setFilterType] = useState('all');
  const [form, setForm] = useState({ date: today, timeFrom: '', timeTo: '', purpose: '', attendees: '' });
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  const set = k => e => setForm(p => ({ ...p, [k]: e.target.value }));
  const filteredRooms = filterType === 'all' ? rooms : rooms.filter(r => r.type === filterType);

  const submit = async () => {
    setError('');
    if (!selectedRoom) return setError('Please select a conference room.');
    if (!form.date || !form.timeFrom || !form.timeTo || !form.purpose.trim()) return setError('All fields are required.');
    if (!isValidTimeRange(form.timeFrom, form.timeTo)) return setError('End time must be after start time.');
    if (form.date < today) return setError('Cannot book a date in the past.');

    setLoading(true);
    try {
      // ─── CHECK FOR TIME CONFLICTS ───
      const { data: existing, error: fetchErr } = await supabase
        .from('reservations')
        .select('*')
        .eq('room_id', selectedRoom.id)
        .eq('date', form.date)
        .in('status', ['pending', 'approved']);

      if (fetchErr) throw fetchErr;

      const conflict = (existing || []).find(r =>
        timesOverlap(form.timeFrom, form.timeTo, r.time_from, r.time_to)
      );

      if (conflict) {
        setError(`⛔ Time conflict: This room is already booked from ${conflict.time_from} to ${conflict.time_to} on ${form.date}. Please choose a different time.`);
        setLoading(false);
        return;
      }

      const { data, error: dbErr } = await supabase.from('reservations').insert({
        room_id: selectedRoom.id, room_name: selectedRoom.name, room_type: selectedRoom.type,
        user_id: currentUser.id, user_full_name: currentUser.fullName, user_email: currentUser.email,
        date: form.date, time_from: form.timeFrom, time_to: form.timeTo,
        purpose: form.purpose, attendees: form.attendees, status: 'pending',
      }).select().single();
      if (dbErr) {
        // The database itself now refuses any overlapping pending/approved booking for
        // the same room (an EXCLUDE constraint), which closes the race window where two
        // people submit for the same room/date/time at nearly the same instant and both
        // pass the earlier client-side check above. Postgres reports that as error code
        // 23P01 (exclusion_violation) — show the same friendly conflict message for it.
        if (dbErr.code === '23P01') {
          throw new Error(`⛔ Time conflict: Someone just booked this room for an overlapping time on ${form.date}. Please choose a different time.`);
        }
        throw dbErr;
      }

      await sendEmail({
        to: currentUser.email, toName: currentUser.fullName,
        subject: `Reservation Submitted – ${selectedRoom.name}`,
        body: `Your reservation for ${selectedRoom.name} on ${form.date} from ${form.timeFrom} to ${form.timeTo} has been submitted and is pending admin approval.`
      });

      toast('Reservation submitted! Pending admin approval.', 'success');
      onBooked(data);
      setSelectedRoom(null);
      setForm({ date: today, timeFrom: '', timeTo: '', purpose: '', attendees: '' });
    } catch (e) { setError(e.message || 'Failed to submit reservation.'); }
    setLoading(false);
  };

  return (
    <div>
      <div style={{display:'flex',gap:'.5rem',marginBottom:'1rem'}}>
        {[['all','All Rooms'],['big','Training Room'],['small','Meeting Room']].map(([v,l]) => (
          <button key={v} className={`btn ${filterType === v ? 'btn-navy' : ''}`} onClick={() => setFilterType(v)}>{l}</button>
        ))}
      </div>

      {(filterType === 'all' || filterType === 'big') && (
        <div className="room-type-section">
          <div className="section-heading">🎓 Big Conference Room</div>
          <div className="rooms-grid">
            {filteredRooms.filter(r => r.type === 'big').map(r => (
              <RoomCard key={r.id} room={r} selected={selectedRoom?.id === r.id} onSelect={setSelectedRoom} />
            ))}
          </div>
        </div>
      )}

      {(filterType === 'all' || filterType === 'small') && (
        <div className="room-type-section">
          <div className="section-heading">🤝 Small Conference Room</div>
          <div className="rooms-grid">
            {filteredRooms.filter(r => r.type === 'small').map(r => (
              <RoomCard key={r.id} room={r} selected={selectedRoom?.id === r.id} onSelect={setSelectedRoom} />
            ))}
          </div>
        </div>
      )}

      {selectedRoom && (
        <div className="booking-panel">
          <div className="panel-title">
            📅 Book: <span style={{color:'var(--accent)'}}>{selectedRoom.name}</span>
          </div>
          {error && <div className="msg-box msg-error">{error}</div>}
          <div className="form-grid">
            <div className="form-field">
              <label className="form-label">Full Name</label>
              <input className="form-input" value={currentUser.fullName} disabled />
            </div>
            <div className="form-field">
              <label className="form-label">Email Address</label>
              <input className="form-input" value={currentUser.email} disabled />
            </div>
            <div className="form-field">
              <label className="form-label">Date</label>
              <input type="date" className="form-input" value={form.date} min={today} onChange={set('date')} />
            </div>
            <div className="form-field">
              <label className="form-label">Number of Attendees</label>
              <input type="number" className="form-input" value={form.attendees} onChange={set('attendees')} placeholder="e.g. 8" min="1" max={selectedRoom.capacity} />
              <span className="form-hint">Room capacity: {selectedRoom.capacity} people</span>
            </div>
            <div className="form-field">
              <label className="form-label">Start Time (24-hour)</label>
              <input type="time" className="form-input" value={form.timeFrom} onChange={set('timeFrom')} />
              <span className="form-hint">Military time, e.g. 09:00, 14:30</span>
            </div>
            <div className="form-field">
              <label className="form-label">End Time (24-hour)</label>
              <input type="time" className="form-input" value={form.timeTo} onChange={set('timeTo')} />
              {form.timeFrom && form.timeTo && !isValidTimeRange(form.timeFrom, form.timeTo) && (
                <span className="form-hint" style={{color:'var(--danger)'}}>End time must be after start time</span>
              )}
            </div>
            <div className="form-field full">
              <label className="form-label">Meeting Purpose / Title</label>
              <input className="form-input" value={form.purpose} onChange={set('purpose')} placeholder="e.g. Q4 Strategy Review" />
            </div>
          </div>
          <div className="form-actions">
            <button className="btn" onClick={() => setSelectedRoom(null)}>Cancel</button>
            <button className="btn btn-navy" onClick={submit} disabled={loading}>
              {loading ? <><span className="spinner" style={{borderTopColor:'#fff'}} /> Submitting…</> : '📋 Submit Reservation'}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function MyReservations({ currentUser, toast, rooms }) {
  const [reservations, setReservations] = useState([]);
  const [loading, setLoading] = useState(true);

  const load = useCallback(async () => {
    setLoading(true);
    try {
      const { data } = await supabase.from('reservations').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
      setReservations(data || []);
    } catch (e) { toast('Failed to load reservations.', 'error'); }
    setLoading(false);
  }, [currentUser.id]);

  useEffect(() => { load(); }, [load]);

  // ─── REALTIME: auto-reload when my reservations change (e.g. admin approves) ───
  useEffect(() => {
    const channel = supabase
      .channel('my-reservations-realtime')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'reservations' }, () => { load(); })
      .subscribe();
    return () => { supabase.removeChannel(channel); };
  }, [load]);

  const cancel = async (res) => {

      await supabase.from('reservations').update({ status: 'cancelled' }).eq('id', res.id);

    return <span className={`status-pill ${map[s] || ''}`}>{icon[s]} {s}</span>;

  return (
    <div className="table-card">

        <span className="table-card-title">My Reservations <span style={{fontSize:10,fontWeight:700,background:'#ecfdf5',color:'#059669',border:'1px solid #6ee7b7',borderRadius:20,padding:'2px 8px',marginLeft:6,verticalAlign:'middle'}}>● LIVE</span></span>

        <div style={{padding:'2rem',textAlign:'center'}}><span className="spinner" /></div>
      ) : reservations.length === 0 ? (
        <div className="empty-state"><div className="es-icon">📅</div><p>No reservations yet</p><p className="es-sub">Book a conference room to get started</p></div>
      ) : (

                <tr key={r.id}>
                  <td><strong>{r.room_name}</strong></td>
                  <td><span className={`status-pill`} style={{background:r.room_type==='big'?'#e8f3fb':'#e8f5ee',color:r.room_type==='big'?'#1a3a5c':'#166534'}}>{r.room_type==='big'?'Training Room':'Meeting Room'}</span></td>
                  <td>{r.date}</td>

                  <td style={{maxWidth:160,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.purpose}</td>
                  <td>{statusPill(r.status)}</td>

            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function ActiveSessionsCard({ toast }) {
  const [sessions, setSessions] = useState([]);
  const [loading, setLoading] = useState(true);

  const load = useCallback(async () => {
    setLoading(true);
    try {
      const { data } = await supabase.from('users').select('id,full_name,email,last_active_at,active_device').eq('is_active', true).order('last_active_at', { ascending: false });
      setSessions(data || []);
    } catch (e) { toast('Failed to load active sessions.', 'error'); }
    setLoading(false);
  }, []);

  useEffect(() => { load(); }, [load]);

  useEffect(() => {
    const channel = supabase
      .channel('admin-active-sessions')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'users' }, () => { load(); })
      .subscribe();
    return () => { supabase.removeChannel(channel); };
  }, [load]);

  const forceRelease = async (u) => {
    if (!confirm(`Force sign out ${u.full_name}? Only do this if they're locked out from a crashed or lost device.`)) return;
    await releaseDbSession(u.id);

  return (
    <div className="table-card" style={{ marginBottom: '1.5rem' }}>

        </span>
      </div>
      {loading ? (
        <div style={{ padding: '1rem', fontSize: 13, color: 'var(--text-muted)' }}>Loading…</div>
      ) : sessions.length === 0 ? (
        <div style={{ padding: '1rem', fontSize: 13, color: 'var(--text-muted)' }}>No user is currently signed in.</div>

        <div style={{ padding: '.25rem 1rem' }}>

            <div key={u.id} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '.6rem 0', borderBottom: '1px solid var(--border)' }}>
              <div>
                <div style={{ fontSize: 13, fontWeight: 600, color: 'var(--navy)' }}>{u.full_name} <span style={{ fontWeight: 400, color: 'var(--text-muted)' }}>({u.email})</span></div>

          ))}
        </div>

function AdminPanel({ toast }) {
  const [reservations, setReservations] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filter, setFilter] = useState('all');
  const [emailModal, setEmailModal] = useState(null);

  const load = useCallback(async () => {
    setLoading(true);
    try {
      const { data } = await supabase.from('reservations').select('*').order('created_at', { ascending: false });
      setReservations(data || []);
    } catch (e) { toast('Failed to load.', 'error'); }
    setLoading(false);
  }, []);

  useEffect(() => { load(); }, [load]);

  // ─── REALTIME: auto-reload admin panel when any reservation changes ───
  useEffect(() => {
    const channel = supabase
      .channel('admin-panel-realtime')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'reservations' }, () => { load(); })
      .subscribe();
    return () => { supabase.removeChannel(channel); };
  }, [load]);

  const updateStatus = async (res, status) => {
    const action = status === 'approved' ? 'approve' : 'decline';
    if (!confirm(`${action.charAt(0).toUpperCase() + action.slice(1)} this reservation?`)) return;
    try {
      await supabase.from('reservations').update({ status, updated_at: new Date().toISOString() }).eq('id', res.id);
      await sendEmail({
        to: res.user_email, toName: res.user_full_name,
        subject: `Reservation ${status === 'approved' ? 'Approved ✅' : 'Declined ❌'} – ${res.room_name}`,
        body: status === 'approved'
          ? `Great news! Your reservation for ${res.room_name} on ${res.date} from ${res.time_from} to ${res.time_to} has been APPROVED.`
          : `Unfortunately, your reservation for ${res.room_name} on ${res.date} from ${res.time_from} to ${res.time_to} has been DECLINED.`
      });
      toast(`Reservation ${status}.`, 'success');
      load();
    } catch (e) { toast(e.message || 'Failed to update.', 'error'); }
  };

  const filtered = filter === 'all' ? reservations : reservations.filter(r => r.status === filter);
  const stats = {
    total: reservations.length,
    pending: reservations.filter(r => r.status === 'pending').length,
    approved: reservations.filter(r => r.status === 'approved').length,
    declined: reservations.filter(r => r.status === 'declined').length,
  };

  const statusPill = s => {
    const map = { pending: 'pill-pending', approved: 'pill-approved', declined: 'pill-declined', cancelled: 'pill-cancelled' };
    const icon = { pending: '⏳', approved: '✅', declined: '❌', cancelled: '🚫' };
    return <span className={`status-pill ${map[s] || ''}`}>{icon[s]} {s}</span>;
  };

  return (
    <div>
      <ActiveSessionsCard toast={toast} />
      <div className="stats-row">
        <div className="stat-card"><div className="stat-label">Total Requests</div><div className="stat-value">{stats.total}</div></div>
        <div className="stat-card"><div className="stat-label">Pending</div><div className="stat-value" style={{color:'var(--warning)'}}>{stats.pending}</div></div>
        <div className="stat-card"><div className="stat-label">Approved</div><div className="stat-value" style={{color:'var(--success)'}}>{stats.approved}</div></div>
        <div className="stat-card"><div className="stat-label">Declined</div><div className="stat-value" style={{color:'var(--danger)'}}>{stats.declined}</div></div>
      </div>

      <div className="table-card">
        <div className="table-card-header">
          <span className="table-card-title">All Reservation Requests <span style={{fontSize:10,fontWeight:700,background:'#ecfdf5',color:'#059669',border:'1px solid #6ee7b7',borderRadius:20,padding:'2px 8px',marginLeft:6,verticalAlign:'middle'}}>● LIVE</span></span>
          <div style={{display:'flex',gap:'.5rem',alignItems:'center'}}>
            <select className="form-input" style={{height:32,fontSize:12,padding:'0 8px'}} value={filter} onChange={e => setFilter(e.target.value)}>
              <option value="all">All Statuses</option>
              <option value="pending">Pending</option>
              <option value="approved">Approved</option>
              <option value="declined">Declined</option>
              <option value="cancelled">Cancelled</option>
            </select>
            <button className="btn btn-sm" onClick={load}>↻ Refresh</button>
          </div>
        </div>
        {loading ? (
          <div style={{padding:'2rem',textAlign:'center'}}><span className="spinner" /></div>
        ) : filtered.length === 0 ? (
          <div className="empty-state"><div className="es-icon">📋</div><p>No reservations found</p></div>
        ) : (
          <div style={{overflowX:'auto'}}>
            <table className="data-table">
              <thead><tr><th>Requester</th><th>Email</th><th>Room</th><th>Type</th><th>Date</th><th>Time (24h)</th><th>Purpose</th><th>Status</th><th>Actions</th></tr></thead>
              <tbody>
                {filtered.map(r => (
                  <tr key={r.id}>
                    <td><strong>{r.user_full_name}</strong></td>
                    <td style={{fontSize:11,color:'var(--text-muted)'}}>{r.user_email}</td>
                    <td>{r.room_name}</td>
                    <td><span style={{fontSize:11,background:r.room_type==='big'?'#e8f3fb':'#e8f5ee',color:r.room_type==='big'?'#1a3a5c':'#166534',padding:'2px 7px',borderRadius:4,fontWeight:600}}>{r.room_type==='big'?'Training Room':'Meeting Room'}</span></td>
                    <td>{r.date}</td>
                    <td style={{fontFamily:'monospace',whiteSpace:'nowrap'}}>{r.time_from} – {r.time_to}</td>
                    <td style={{maxWidth:140,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.purpose}</td>
                    <td>{statusPill(r.status)}</td>
                    <td>
                      <div style={{display:'flex',gap:4,flexWrap:'nowrap'}}>

                          <>
                            <button className="btn btn-sm btn-success" onClick={() => updateStatus(r, 'approved')}>✓ Approve</button>
                            <button className="btn btn-sm btn-danger" onClick={() => updateStatus(r, 'declined')}>✕ Decline</button>
                          </>
