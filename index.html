<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans, 'Inter', sans-serif); background: var(--surface-0, #f5f5f3); color: var(--text-primary, #1a1a18); min-height: 100vh; }

  /* ---- AUTH ---- */
  .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
  .auth-card { background: var(--surface-2, #fff); border: 0.5px solid var(--border, #e0ddd5); border-radius: 16px; padding: 2.5rem 2rem; width: 100%; max-width: 420px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 2rem; }
  .brand-icon { width: 40px; height: 40px; background: #1a3a5c; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; font-weight: 700; }
  .brand-text h1 { font-size: 18px; font-weight: 600; color: #1a3a5c; }
  .brand-text p { font-size: 11px; color: var(--text-muted, #888); letter-spacing: .05em; text-transform: uppercase; }
  .auth-title { font-size: 20px; font-weight: 600; margin-bottom: .25rem; }
  .auth-sub { font-size: 13px; color: var(--text-secondary, #666); margin-bottom: 1.5rem; }
  .field { margin-bottom: 1rem; }
  .field label { display: block; font-size: 12px; font-weight: 500; color: var(--text-secondary, #666); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .04em; }
  .field input { width: 100%; height: 40px; padding: 0 12px; border: 0.5px solid var(--border-strong, #ccc); border-radius: 8px; font-size: 14px; background: var(--surface-1, #f9f9f7); color: var(--text-primary, #1a1a18); outline: none; }
  .field input:focus { border-color: #1a3a5c; box-shadow: 0 0 0 2px rgba(26,58,92,.15); }
  .btn-primary { width: 100%; height: 42px; background: #1a3a5c; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s; }
  .btn-primary:hover { background: #142f4e; }
  .btn-primary:disabled { background: #7a9cc0; cursor: not-allowed; }
  .error-msg { background: var(--bg-danger, #fef2f2); border: 0.5px solid var(--border-danger, #fca5a5); color: var(--text-danger, #b91c1c); border-radius: 8px; padding: .6rem .75rem; font-size: 13px; margin-bottom: 1rem; }
  .success-msg { background: #f0fdf4; border: 0.5px solid #86efac; color: #15803d; border-radius: 8px; padding: .6rem .75rem; font-size: 13px; margin-bottom: 1rem; }
  .demo-creds { margin-top: 1.25rem; padding: .75rem; background: var(--surface-1, #f9f9f7); border-radius: 8px; border: 0.5px solid var(--border, #e0ddd5); }
  .demo-creds p { font-size: 12px; color: var(--text-muted, #888); margin-bottom: .35rem; font-weight: 500; }
  .demo-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary, #555); margin-bottom: 2px; cursor: pointer; }
  .demo-row:hover { color: #1a3a5c; text-decoration: underline; }

  /* ---- LAYOUT ---- */
  .app { display: flex; min-height: 100vh; }
  .sidebar { width: 220px; background: #0f2540; color: #fff; display: flex; flex-direction: column; padding: 1.5rem 1rem; flex-shrink: 0; }
  .sidebar-brand { display: flex; align-items: center; gap: 8px; margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 0.5px solid rgba(255,255,255,.1); }
  .sidebar-brand .icon { width: 34px; height: 34px; background: #1a3a5c; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; }
  .sidebar-brand .txt h2 { font-size: 14px; font-weight: 700; }
  .sidebar-brand .txt p { font-size: 10px; color: rgba(255,255,255,.5); letter-spacing: .06em; text-transform: uppercase; }
  .nav-section { margin-bottom: 1.5rem; }
  .nav-label { font-size: 10px; color: rgba(255,255,255,.4); letter-spacing: .08em; text-transform: uppercase; margin-bottom: .5rem; padding-left: .5rem; }
  .nav-item { display: flex; align-items: center; gap: 9px; padding: .55rem .75rem; border-radius: 8px; cursor: pointer; font-size: 13px; color: rgba(255,255,255,.7); transition: all .15s; margin-bottom: 2px; border: none; background: none; width: 100%; text-align: left; }
  .nav-item:hover { background: rgba(255,255,255,.08); color: #fff; }
  .nav-item.active { background: #1a3a5c; color: #fff; font-weight: 500; }
  .nav-item .ni { font-size: 15px; }
  .sidebar-footer { margin-top: auto; }
  .user-chip { display: flex; align-items: center; gap: 9px; padding: .6rem; background: rgba(255,255,255,.07); border-radius: 10px; cursor: pointer; }
  .user-chip .av { width: 30px; height: 30px; border-radius: 50%; background: #2a6496; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
  .user-chip .info p { font-size: 12px; font-weight: 500; line-height: 1.2; }
  .user-chip .info span { font-size: 10px; color: rgba(255,255,255,.5); }
  .logout-btn { display: flex; align-items: center; gap: 6px; margin-top: .5rem; padding: .4rem .6rem; border: none; background: none; color: rgba(255,255,255,.5); font-size: 12px; cursor: pointer; width: 100%; border-radius: 6px; }
  .logout-btn:hover { color: #fff; background: rgba(255,255,255,.06); }

  /* ---- MAIN ---- */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar { background: var(--surface-2, #fff); border-bottom: 0.5px solid var(--border, #e0ddd5); padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; }
  .page-title { font-size: 16px; font-weight: 600; }
  .page-sub { font-size: 12px; color: var(--text-muted, #888); }
  .topbar-actions { display: flex; gap: 8px; }
  .btn-sm { height: 34px; padding: 0 14px; border-radius: 7px; font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 6px; border: 0.5px solid var(--border-strong, #ccc); background: var(--surface-2, #fff); color: var(--text-primary, #1a1a18); transition: all .15s; }
  .btn-sm:hover { background: var(--surface-1, #f5f5f3); }
  .btn-sm.accent { background: #1a3a5c; color: #fff; border-color: #1a3a5c; }
  .btn-sm.accent:hover { background: #142f4e; }

  .content { flex: 1; overflow-y: auto; padding: 1.5rem; }

  /* ---- ROOMS ---- */
  .rooms-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
  .room-card { background: var(--surface-2, #fff); border: 0.5px solid var(--border, #e0ddd5); border-radius: 14px; padding: 1.25rem; cursor: pointer; transition: all .15s; position: relative; overflow: hidden; }
  .room-card:hover { border-color: #1a3a5c; box-shadow: 0 4px 12px rgba(26,58,92,.1); }
  .room-card.selected { border-color: #1a3a5c; border-width: 2px; }
  .room-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px; margin-bottom: .75rem; text-transform: uppercase; letter-spacing: .04em; }
  .badge-large { background: #e8f0f8; color: #1a3a5c; }
  .badge-small { background: #e8f5ee; color: #186b3a; }
  .room-name { font-size: 17px; font-weight: 600; margin-bottom: .35rem; }
  .room-meta { font-size: 12px; color: var(--text-secondary, #666); display: flex; gap: 12px; flex-wrap: wrap; }
  .room-meta span { display: flex; align-items: center; gap: 4px; }

  /* ---- BOOKING FORM ---- */
  .booking-panel { background: var(--surface-2, #fff); border: 0.5px solid var(--border, #e0ddd5); border-radius: 14px; padding: 1.5rem; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .form-field { display: flex; flex-direction: column; gap: 5px; }
  .form-field label { font-size: 12px; font-weight: 500; color: var(--text-secondary, #666); text-transform: uppercase; letter-spacing: .04em; }
  .form-field input, .form-field select, .form-field textarea { border: 0.5px solid var(--border-strong, #ccc); border-radius: 8px; padding: 8px 12px; font-size: 13px; background: var(--surface-1, #f9f9f7); color: var(--text-primary, #1a1a18); outline: none; font-family: inherit; }
  .form-field input:focus, .form-field select:focus, .form-field textarea:focus { border-color: #1a3a5c; box-shadow: 0 0 0 2px rgba(26,58,92,.12); }
  .form-field.full { grid-column: 1 / -1; }
  .form-actions { display: flex; gap: .75rem; margin-top: 1.25rem; justify-content: flex-end; }
  .btn-cancel { height: 38px; padding: 0 16px; border: 0.5px solid var(--border-strong, #ccc); border-radius: 8px; background: transparent; font-size: 13px; cursor: pointer; color: var(--text-secondary, #666); }
  .btn-submit { height: 38px; padding: 0 20px; background: #1a3a5c; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .btn-submit:disabled { background: #7a9cc0; cursor: not-allowed; }

  /* ---- TABLE ---- */
  .table-wrap { background: var(--surface-2, #fff); border: 0.5px solid var(--border, #e0ddd5); border-radius: 14px; overflow: hidden; }
  .table-head { padding: 1rem 1.25rem; border-bottom: 0.5px solid var(--border, #e0ddd5); display: flex; align-items: center; justify-content: space-between; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 10px; font-weight: 600; color: var(--text-muted, #888); text-transform: uppercase; letter-spacing: .05em; padding: .4rem .75rem; background: var(--surface-1, #f9f9f7); border-bottom: 0.5px solid var(--border, #e0ddd5); }
  td { padding: .4rem .75rem; font-size: 12px; border-bottom: 0.5px solid var(--border, #e0ddd5); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface-1, #f9f9f7); }
  .status-pill { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 20px; text-transform: capitalize; }
  .status-confirmed { background: #d1fae5; color: #065f46; }
  .status-pending { background: #fef3c7; color: #92400e; }
  .status-cancelled { background: #fee2e2; color: #991b1b; }
  .action-btns { display: flex; gap: 5px; }
  .act-btn { height: 22px; padding: 0 8px; border-radius: 5px; font-size: 10px; cursor: pointer; border: 0.5px solid var(--border-strong, #ccc); background: transparent; font-weight: 500; }
  .act-btn.del { color: #b91c1c; border-color: #fca5a5; }
  .act-btn.del:hover { background: #fee2e2; }
  .act-btn.app { color: #065f46; border-color: #6ee7b7; }
  .act-btn.app:hover { background: #d1fae5; }
  .act-btn.email { color: #1a3a5c; border-color: #93c5fd; }
  .act-btn.email:hover { background: #dbeafe; }

  /* ---- STATS ---- */
  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: .75rem; margin-bottom: 1.25rem; }
  .stat-card { background: var(--surface-2, #fff); border: 0.5px solid var(--border, #e0ddd5); border-radius: 12px; padding: 1rem; }
  .stat-card .s-label { font-size: 11px; color: var(--text-muted, #888); text-transform: uppercase; letter-spacing: .05em; margin-bottom: .35rem; }
  .stat-card .s-val { font-size: 26px; font-weight: 600; line-height: 1; color: #1a3a5c; }
  .stat-card .s-sub { font-size: 11px; color: var(--text-secondary, #666); margin-top: .25rem; }

  /* ---- SPINNER ---- */
  .spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- MODAL ---- */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 1rem; }
  .modal-box { background: var(--surface-2, #fff); border-radius: 16px; padding: 2rem; width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto; }
  .modal-title { font-size: 17px; font-weight: 600; margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; }
  .close-btn { background: none; border: none; cursor: pointer; font-size: 18px; color: var(--text-muted, #888); }

  /* ---- EMAIL LOG ---- */
  .log-entry { padding: .75rem 1rem; border-bottom: 0.5px solid var(--border, #e0ddd5); font-size: 12px; display: flex; gap: .75rem; align-items: flex-start; }
  .log-icon { color: #1a3a5c; font-size: 16px; margin-top: 1px; }
  .log-body p { color: var(--text-primary, #1a1a18); margin-bottom: 2px; }
  .log-body span { color: var(--text-muted, #888); }

  .tag { display: inline-block; font-size: 9px; padding: 1px 5px; border-radius: 4px; font-weight: 600; margin-left: 5px; }
  .tag-large { background: #e8f0f8; color: #1a3a5c; }
  .tag-small { background: #e8f5ee; color: #186b3a; }

  .user-table td { padding: .6rem .75rem; }

  .section-title { font-size: 14px; font-weight: 600; margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; }
  .section-title::after { content: ''; flex: 1; height: 0.5px; background: var(--border, #e0ddd5); }

  .select-prompt { text-align: center; padding: 2.5rem 1rem; color: var(--text-muted, #888); font-size: 14px; }
  .select-prompt .big-icon { font-size: 36px; margin-bottom: .5rem; opacity: .4; }

  .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: #0f2540; color: #fff; padding: .75rem 1rem; border-radius: 10px; font-size: 13px; z-index: 9999; max-width: 300px; box-shadow: 0 4px 16px rgba(0,0,0,.2); animation: slideIn .3s ease; }
  @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @media (max-width: 600px) {
    .sidebar { display: none; }
    .form-grid { grid-template-columns: 1fr; }
    .stats-row { grid-template-columns: 1fr 1fr; }
  }
</style>

<body>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<script>
const { useState, useEffect, useCallback } = React;
const h = React.createElement;

// ─── CONFIG ───────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'crrs_data';
const SHEETS_LOG_KEY = 'crrs_sheets_log';

const DEFAULT_USERS = [
  { id: 1, email: 'admin@crrs.com', password: 'admin123', name: 'Admin User', role: 'admin' },
  { id: 2, email: 'john@company.com', password: 'user123', name: 'John Santos', role: 'user' },
  { id: 3, email: 'maria@company.com', password: 'user123', name: 'Maria Reyes', role: 'user' },
];

const ROOMS = [
  { id: 'large', name: 'Big Conference Room', type: 'large', capacity: 20, floor: '5th Floor', amenities: ['Projector', 'Whiteboard', 'Video Conf', 'Coffee Bar'] },
  { id: 'small', name: 'Small Conference Room', type: 'small', capacity: 8, floor: '5th Floor', amenities: ['TV Screen', 'Whiteboard', 'Speakerphone'] },
];

function loadData() {
  try {
    const d = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if (!d) return null;
    if (d?.bookings) {
      d.bookings = d.bookings.map(b => ({
        ...b,
        roomName: b.roomName === 'Boardroom Alpha' ? 'Big Conference Room' : b.roomName === 'Focus Room Beta' ? 'Small Conference Room' : b.roomName
      }));
    }
    // Merge saved users with DEFAULT_USERS — saved users take priority, but defaults fill any gaps
    const savedUsers = d.users || [];
    const merged = [...savedUsers];
    DEFAULT_USERS.forEach(def => {
      if (!merged.find(u => u.email === def.email)) merged.push(def);
    });
    d.users = merged;
    return d;
  } catch { return null; }
}
function saveData(d) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch {}
}
function loadLogs() {
  try { return JSON.parse(localStorage.getItem(SHEETS_LOG_KEY) || '[]'); } catch { return []; }
}
function saveLogs(l) {
  try { localStorage.setItem(SHEETS_LOG_KEY, JSON.stringify(l)); } catch {}
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
  const [users, setUsers] = useState(() => { const d = loadData(); return d?.users || DEFAULT_USERS; });
  const [bookings, setBookings] = useState(() => { const d = loadData(); return d?.bookings || []; });
  const [currentUser, setCurrentUser] = useState(null);
  const [page, setPage] = useState('dashboard');
  const [toast, setToast] = useState(null);
  const [sheetsLog, setSheetsLog] = useState(loadLogs);

  useEffect(() => { saveData({ users, bookings }); }, [users, bookings]);
  useEffect(() => { saveLogs(sheetsLog); }, [sheetsLog]);

  const showToast = useCallback((msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 3500);
  }, []);

  const addSheetsEntry = useCallback((entry) => {
    setSheetsLog(prev => [{ ...entry, id: Date.now(), ts: new Date().toLocaleString() }, ...prev.slice(0, 49)]);
  }, []);

  const resetPassword = useCallback((userId, newPass) => {
    setUsers(prev => prev.map(u => u.id === userId ? { ...u, password: newPass } : u));
  }, []);

  if (!currentUser) return h(LoginPage, { users, onLogin: u => { setCurrentUser(u); setPage('dashboard'); }, onResetPassword: resetPassword });

  return h('div', { className: 'app' },
    h(Sidebar, { user: currentUser, page, setPage, onLogout: () => setCurrentUser(null) }),
    h('div', { className: 'main' },
      h(TopBar, { page, user: currentUser }),
      h('div', { className: 'content' },
        page === 'dashboard' && h(Dashboard, { bookings, user: currentUser, rooms: ROOMS }),
        page === 'book' && h(BookRoom, { bookings, setBookings, user: currentUser, rooms: ROOMS, showToast, addSheetsEntry }),
        page === 'mybookings' && h(MyBookings, { bookings, setBookings, user: currentUser, showToast, addSheetsEntry }),
        page === 'admin_bookings' && currentUser.role === 'admin' && h(AdminBookings, { bookings, setBookings, users, showToast, addSheetsEntry }),
        page === 'manage_users' && currentUser.role === 'admin' && h(ManageUsers, { users, setUsers, currentUser, showToast }),
        page === 'sheets' && h(SheetsViewer, { bookings, sheetsLog }),
        page === 'email_log' && h(EmailLog, { sheetsLog: sheetsLog.filter(l => l.type === 'email') }),
      )
    ),
    toast && h('div', { className: 'toast' }, '✓ ', toast)
  );
}

// ─── LOGIN ────────────────────────────────────────────────────────────────────
function LoginPage({ users, onLogin, onResetPassword }) {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);
  const [mode, setMode] = useState('login'); // 'login' | 'forgot_email' | 'forgot_question' | 'reset'
  const [fpEmail, setFpEmail] = useState('');
  const [fpAnswer, setFpAnswer] = useState('');
  const [fpNewPass, setFpNewPass] = useState('');
  const [fpUser, setFpUser] = useState(null);
  const [fpError, setFpError] = useState('');
  const [fpSuccess, setFpSuccess] = useState('');

  const submit = async () => {
    setError('');
    setLoading(true);
    await new Promise(r => setTimeout(r, 700));
    const user = users.find(u => u.email === email && u.password === password);
    if (user) onLogin(user);
    else { setError('Incorrect email or password. Please try again.'); setLoading(false); }
  };

  const handleFpEmail = () => {
    setFpError('');
    const u = users.find(u => u.email === fpEmail);
    if (!u) { setFpError('No account found with that email.'); return; }
    if (!u.securityQuestion) { setFpError('This account has no recovery question set. Please contact your admin.'); return; }
    setFpUser(u);
    setMode('forgot_question');
  };

  const handleFpAnswer = () => {
    setFpError('');
    if (!fpAnswer.trim()) { setFpError('Please enter your answer.'); return; }
    if (fpAnswer.trim().toLowerCase() !== fpUser.securityAnswer?.toLowerCase()) { setFpError('Incorrect answer. Please try again.'); return; }
    setMode('reset');
  };

  const handleReset = () => {
    setFpError('');
    if (!fpNewPass || fpNewPass.length < 4) { setFpError('Password must be at least 4 characters.'); return; }
    onResetPassword(fpUser.id, fpNewPass);
    setFpSuccess('Password reset successfully! You can now sign in.');
    setMode('login');
    setFpEmail(''); setFpAnswer(''); setFpNewPass(''); setFpUser(null);
  };

  return h('div', { className: 'auth-wrap' },
    h('div', { className: 'auth-card' },
      h('div', { className: 'brand' },
        h('div', { className: 'brand-icon' }, 'C'),
        h('div', { className: 'brand-text' }, h('h1', null, 'CRRS'), h('p', null, 'Conference Room Reservation'))
      ),

      mode === 'login' && h('div', null,
        h('div', { className: 'auth-title' }, 'Sign in to your account'),
        h('div', { className: 'auth-sub' }, 'Use your email and password to access the system.'),
        fpSuccess && h('div', { className: 'success-msg' }, '✓ ' + fpSuccess),
        error && h('div', { className: 'error-msg' }, error),
        h('div', { className: 'field' },
          h('label', null, 'Email address'),
          h('input', { type: 'email', value: email, placeholder: 'you@company.com', onChange: e => setEmail(e.target.value), onKeyDown: e => e.key === 'Enter' && submit() })
        ),
        h('div', { className: 'field' },
          h('label', null, 'Password'),
          h('input', { type: 'password', value: password, placeholder: '••••••••', onChange: e => setPassword(e.target.value), onKeyDown: e => e.key === 'Enter' && submit() })
        ),
        h('button', { className: 'btn-primary', onClick: submit, disabled: !email || !password || loading },
          loading ? h('span', { className: 'spinner' }) : 'Sign in'
        ),
        h('div', { style: { textAlign: 'center', marginTop: '1rem' } },
          h('button', { onClick: () => { setMode('forgot_email'); setFpError(''); setFpEmail(''); }, style: { background: 'none', border: 'none', color: '#1a3a5c', fontSize: 13, cursor: 'pointer', textDecoration: 'underline' } }, 'Forgot password?')
        )
      ),

      mode === 'forgot_email' && h('div', null,
        h('div', { className: 'auth-title' }, '🔑 Forgot Password'),
        h('div', { className: 'auth-sub' }, 'Enter your email address to find your account.'),
        fpError && h('div', { className: 'error-msg' }, fpError),
        h('div', { className: 'field' },
          h('label', null, 'Email address'),
          h('input', { type: 'email', value: fpEmail, placeholder: 'you@company.com', autoFocus: true, onChange: e => setFpEmail(e.target.value), onKeyDown: e => e.key === 'Enter' && handleFpEmail() })
        ),
        h('button', { className: 'btn-primary', onClick: handleFpEmail, disabled: !fpEmail }, 'Continue'),
        h('div', { style: { textAlign: 'center', marginTop: '1rem' } },
          h('button', { onClick: () => setMode('login'), style: { background: 'none', border: 'none', color: '#888', fontSize: 13, cursor: 'pointer', textDecoration: 'underline' } }, '← Back to Sign in')
        )
      ),

      mode === 'forgot_question' && fpUser && h('div', null,
        h('div', { className: 'auth-title' }, '🔐 Security Question'),
        h('div', { className: 'auth-sub' }, `Answering for: ${fpUser.email}`),
        fpError && h('div', { className: 'error-msg' }, fpError),
        h('div', { style: { background: '#f0f4f8', border: '0.5px solid #c9d8e8', borderRadius: 8, padding: '.75rem 1rem', marginBottom: '1rem', fontSize: 13, color: '#1a3a5c', fontWeight: 500 } }, '❓ ' + fpUser.securityQuestion),
        h('div', { className: 'field' },
          h('label', null, 'Your Answer'),
          h('input', { type: 'text', value: fpAnswer, placeholder: 'Type your answer...', autoFocus: true, onChange: e => setFpAnswer(e.target.value), onKeyDown: e => e.key === 'Enter' && handleFpAnswer() })
        ),
        h('button', { className: 'btn-primary', onClick: handleFpAnswer, disabled: !fpAnswer }, 'Verify Answer'),
        h('div', { style: { textAlign: 'center', marginTop: '1rem' } },
          h('button', { onClick: () => { setMode('forgot_email'); setFpError(''); }, style: { background: 'none', border: 'none', color: '#888', fontSize: 13, cursor: 'pointer', textDecoration: 'underline' } }, '← Back')
        )
      ),

      mode === 'reset' && h('div', null,
        h('div', { className: 'auth-title' }, '🔓 Reset Password'),
        h('div', { className: 'auth-sub' }, 'Enter your new password below.'),
        fpError && h('div', { className: 'error-msg' }, fpError),
        h('div', { className: 'field' },
          h('label', null, 'New Password'),
          h('input', { type: 'password', value: fpNewPass, placeholder: '••••••••', autoFocus: true, onChange: e => setFpNewPass(e.target.value), onKeyDown: e => e.key === 'Enter' && handleReset() })
        ),
        h('button', { className: 'btn-primary', onClick: handleReset, disabled: !fpNewPass }, 'Reset Password')
      )
    )
  );
}

// ─── SIDEBAR ─────────────────────────────────────────────────────────────────
function Sidebar({ user, page, setPage, onLogout }) {
  const navs = [
    { id: 'dashboard', icon: '📊', label: 'Dashboard' },
    { id: 'book', icon: '📅', label: 'Book a Room' },
    { id: 'mybookings', icon: '🗂', label: 'My Bookings' },
    ...(user.role === 'admin' ? [
      { id: 'admin_bookings', icon: '🛡', label: 'All Reservations' },
      { id: 'manage_users', icon: '👥', label: 'Manage Users' },
      { id: 'sheets', icon: '📋', label: 'Google Sheets' },
      { id: 'email_log', icon: '📧', label: 'Email Log' },
    ] : []),
  ];
  const initials = user.name.split(' ').map(w => w[0]).join('').toUpperCase();
  return h('div', { className: 'sidebar' },
    h('div', { className: 'sidebar-brand' },
      h('div', { className: 'icon' }, 'C'),
      h('div', { className: 'txt' }, h('h2', null, 'CRRS'), h('p', null, 'Reservations'))
    ),
    h('div', { className: 'nav-section' },
      h('div', { className: 'nav-label' }, 'Menu'),
      navs.map(n => h('button', { key: n.id, className: `nav-item${page === n.id ? ' active' : ''}`, onClick: () => setPage(n.id) },
        h('span', { className: 'ni' }, n.icon), n.label
      ))
    ),
    h('div', { className: 'sidebar-footer' },
      h('div', { className: 'user-chip' },
        h('div', { className: 'av' }, initials),
        h('div', { className: 'info' }, h('p', null, user.name), h('span', null, user.role === 'admin' ? 'Administrator' : 'User'))
      ),
      h('button', { className: 'logout-btn', onClick: onLogout }, '🚪 Sign out')
    )
  );
}

// ─── TOPBAR ──────────────────────────────────────────────────────────────────
function TopBar({ page, user }) {
  const titles = { dashboard: ['Dashboard', 'Overview of conference room activity'], book: ['Book a Room', 'Reserve a conference room'], mybookings: ['My Bookings', 'Your upcoming and past reservations'], admin_bookings: ['All Reservations', 'Manage all conference room bookings'], manage_users: ['Manage Users', 'Add users and manage roles'], sheets: ['Google Sheets', 'Live data export view'], email_log: ['Email Log', 'Sent confirmation emails'] };
  const [t, s] = titles[page] || ['CRRS', ''];
  return h('div', { className: 'topbar' },
    h('div', null, h('div', { className: 'page-title' }, t), h('div', { className: 'page-sub' }, s)),
    h('div', { className: 'topbar-actions' },
      h('span', { style: { fontSize: 12, color: 'var(--text-muted)', alignSelf: 'center' } }, new Date().toLocaleDateString('en-PH', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }))
    )
  );
}

// ─── DASHBOARD ───────────────────────────────────────────────────────────────
function Dashboard({ bookings, user, rooms }) {
  const today = new Date().toISOString().split('T')[0];
  const mine = user.role === 'admin' ? bookings : bookings.filter(b => b.userId === user.id);
  const todayBooks = mine.filter(b => b.date === today);
  const upcoming = mine.filter(b => b.date > today && b.status !== 'cancelled');
  const confirmed = mine.filter(b => b.status === 'confirmed');

  return h('div', null,
    h('div', { className: 'stats-row' },
      StatCard('Total Bookings', mine.length, 'All time'),
      StatCard("Today's", todayBooks.length, 'meetings today'),
      StatCard('Upcoming', upcoming.length, 'scheduled'),
      StatCard('Confirmed', confirmed.length, 'approved')
    ),
    h('div', { className: 'section-title' }, 'Available Rooms'),
    h('div', { className: 'rooms-grid' },
      rooms.map(room => h(RoomPreviewCard, { key: room.id, room, bookings }))
    ),
    h('div', { className: 'section-title' }, 'Recent Bookings'),
    h('div', { className: 'table-wrap' },
      h('table', null,
        h('thead', null, h('tr', null, ['Room', 'Meeting', 'Date', 'Time', 'Status'].map(c => h('th', { key: c }, c)))),
        h('tbody', null, [...mine].sort((a, b) => (b.date > a.date ? 1 : b.date < a.date ? -1 : 0)).slice(0, 6).map(b =>
          h('tr', { key: b.id },
            h('td', null, h('span', null, b.roomName), h('span', { className: `tag tag-${b.roomType}` }, b.roomType)),
            h('td', null, h('span', { style: { fontWeight: 500, fontSize: 12 } }, b.title || '—')),
            h('td', null, formatDate(b.date)),
            h('td', null, `${b.startTime}–${b.endTime}`),
            h('td', null, h('span', { className: `status-pill status-${b.status}` }, b.status))
          )
        ))
      )
    )
  );
}
function StatCard(label, val, sub) {
  return h('div', { className: 'stat-card' }, h('div', { className: 's-label' }, label), h('div', { className: 's-val' }, val), h('div', { className: 's-sub' }, sub));
}
function RoomPreviewCard({ room, bookings }) {
  const today = new Date().toISOString().split('T')[0];
  const todayCount = bookings.filter(b => b.roomId === room.id && b.date === today && b.status !== 'cancelled').length;
  return h('div', { className: 'room-card' },
    h('div', { className: `room-badge ${room.type === 'large' ? 'badge-large' : 'badge-small'}` }, room.type === 'large' ? '🏢 Large Room' : '🪑 Small Room'),
    h('div', { className: 'room-name' }, room.name),
    h('div', { className: 'room-meta' },
      h('span', null, `👥 Up to ${room.capacity}`),
      h('span', null, `📍 ${room.floor}`),
      h('span', null, `📅 ${todayCount} booking(s) today`)
    ),
    h('div', { style: { marginTop: '.75rem', display: 'flex', flexWrap: 'wrap', gap: 5 } },
      room.amenities.map(a => h('span', { key: a, style: { fontSize: 11, background: 'var(--surface-1,#f5f5f3)', padding: '3px 8px', borderRadius: 20, color: 'var(--text-secondary,#666)', border: '0.5px solid var(--border,#e0ddd5)' } }, a))
    )
  );
}

// ─── BOOK ROOM ───────────────────────────────────────────────────────────────
function BookRoom({ bookings, setBookings, user, rooms, showToast, addSheetsEntry }) {
  const [selectedRoom, setSelectedRoom] = useState(null);
  const [form, setForm] = useState({ date: '', startTime: '09:00', endTime: '10:00', title: '', attendees: '', notes: '' });
  const [loading, setLoading] = useState(false);
  const [conflict, setConflict] = useState(false);
  const [aiSummary, setAiSummary] = useState('');
  const [aiLoading, setAiLoading] = useState(false);

  const checkConflict = (roomId, date, start, end) => {
    if (!roomId || !date || !start || !end) return false;
    return bookings.some(b => b.roomId === roomId && b.date === date && b.status !== 'cancelled' && !(end <= b.startTime || start >= b.endTime));
  };

  useEffect(() => {
    setConflict(checkConflict(selectedRoom?.id, form.date, form.startTime, form.endTime));
  }, [selectedRoom, form.date, form.startTime, form.endTime, bookings]);

  const generateAiSummary = async () => {
    if (!form.title || !selectedRoom) return;
    setAiLoading(true);
    setAiSummary('');
    try {
      const resp = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6', max_tokens: 1000,
          messages: [{ role: 'user', content: `Generate a professional email body (no subject line) for a conference room booking confirmation. Details: Meeting: "${form.title}", Room: ${selectedRoom.name} (${selectedRoom.type} room, capacity ${selectedRoom.capacity}), Date: ${form.date}, Time: ${form.startTime}–${form.endTime}, Organizer: ${user.name} (${user.email}), Notes: ${form.notes || 'None'}. Keep it concise, professional, 3-4 short paragraphs. Sign off as "CRRS System".` }]
        })
      });
      const data = await resp.json();
      setAiSummary(data.content?.[0]?.text || 'Could not generate email preview.');
    } catch { setAiSummary('AI email generation unavailable.'); }
    setAiLoading(false);
  };

  const submit = async () => {
    if (!selectedRoom || !form.date || !form.title || conflict) return;
    setLoading(true);
    await new Promise(r => setTimeout(r, 800));

    const booking = {
      id: Date.now(),
      roomId: selectedRoom.id,
      roomName: selectedRoom.name,
      roomType: selectedRoom.type,
      userId: user.id,
      userName: user.name,
      userEmail: user.email,
      date: form.date,
      startTime: form.startTime,
      endTime: form.endTime,
      title: form.title,
      attendees: form.attendees,
      notes: form.notes,
      status: 'pending',
      createdAt: new Date().toISOString(),
    };

    setBookings(prev => [booking, ...prev]);

    // Log to sheets
    addSheetsEntry({ type: 'booking', action: 'New booking created', room: selectedRoom.name, user: user.name, date: form.date, time: `${form.startTime}–${form.endTime}`, title: form.title });

    // Simulate email
    await sendConfirmationEmail(booking, aiSummary, addSheetsEntry);

    setLoading(false);
    showToast(`Booking submitted! Confirmation email sent to ${user.email}`);
    setForm({ date: '', startTime: '09:00', endTime: '10:00', title: '', attendees: '', notes: '' });
    setSelectedRoom(null);
    setAiSummary('');
  };

  return h('div', null,
    h('div', { className: 'section-title' }, 'Select a Room'),
    h('div', { className: 'rooms-grid' },
      rooms.map(room => h('div', {
        key: room.id,
        className: `room-card${selectedRoom?.id === room.id ? ' selected' : ''}`,
        onClick: () => setSelectedRoom(room)
      },
        h('div', { className: `room-badge ${room.type === 'large' ? 'badge-large' : 'badge-small'}` }, room.type === 'large' ? '🏢 Large Room' : '🪑 Small Room'),
        h('div', { className: 'room-name' }, room.name),
        h('div', { className: 'room-meta' }, h('span', null, `👥 ${room.capacity} capacity`), h('span', null, `📍 ${room.floor}`)),
        h('div', { style: { marginTop: '.5rem', display: 'flex', flexWrap: 'wrap', gap: 4 } },
          room.amenities.map(a => h('span', { key: a, style: { fontSize: 11, background: 'var(--surface-0,#f5f5f3)', padding: '2px 7px', borderRadius: 20, color: 'var(--text-secondary,#666)', border: '0.5px solid var(--border,#e0ddd5)' } }, a))
        ),
        selectedRoom?.id === room.id && h('div', { style: { position: 'absolute', top: 12, right: 12, background: '#1a3a5c', color: '#fff', borderRadius: '50%', width: 20, height: 20, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11 } }, '✓')
      ))
    ),
    selectedRoom ? h('div', { className: 'booking-panel' },
      h('div', { className: 'section-title' }, `Booking Details — ${selectedRoom.name}`),
      conflict && h('div', { className: 'error-msg' }, '⚠️ This time slot conflicts with an existing booking. Please choose a different time.'),
      h('div', { className: 'form-grid' },
        h('div', { className: 'form-field' },
          h('label', null, 'Meeting Title'),
          h('input', { type: 'text', placeholder: 'e.g. Q3 Planning Session', value: form.title, onChange: e => setForm(f => ({ ...f, title: e.target.value })) })
        ),
        h('div', { className: 'form-field' },
          h('label', null, 'Meeting Date'),
          h('input', { type: 'date', value: form.date, min: new Date().toISOString().split('T')[0], onChange: e => setForm(f => ({ ...f, date: e.target.value })) })
        ),
        h('div', { className: 'form-field' },
          h('label', null, 'Start Time'),
          h('select', { value: form.startTime, onChange: e => setForm(f => ({ ...f, startTime: e.target.value })) }, timeOptions().map(t => h('option', { key: t, value: t }, t)))
        ),
        h('div', { className: 'form-field' },
          h('label', null, 'End Time'),
          h('select', { value: form.endTime, onChange: e => setForm(f => ({ ...f, endTime: e.target.value })) }, timeOptions().map(t => h('option', { key: t, value: t }, t)))
        ),
        h('div', { className: 'form-field full' },
          h('label', null, 'Attendee Emails (comma-separated)'),
          h('input', { type: 'text', placeholder: 'e.g. alice@co.com, bob@co.com', value: form.attendees, onChange: e => setForm(f => ({ ...f, attendees: e.target.value })) })
        ),
        h('div', { className: 'form-field full' },
          h('label', null, 'Notes / Agenda'),

      ),

      h('div', { className: 'form-actions' },

        )
      )
    ) : h('div', { className: 'select-prompt' }, h('div', { className: 'big-icon' }, '🏢'), h('p', null, 'Select a room above to begin your reservation'))
  );
}

function timeOptions() {
  const opts = [];
  for (let h = 7; h <= 20; h++) { opts.push(`${String(h).padStart(2,'0')}:00`); opts.push(`${String(h).padStart(2,'0')}:30`); }
  return opts;
}

async function sendConfirmationEmail(booking, aiBody, addSheetsEntry) {
  const emailBody = aiBody || `Dear ${booking.userName},\n\nThank you for submitting your reservation request. We have received your booking and it is now pending admin approval.\n\nReservation Details:\n• Meeting: ${booking.title}\n• Room: ${booking.roomName}\n• Date: ${booking.date}\n• Time: ${booking.startTime} – ${booking.endTime}\n\nStatus: Pending Approval\n\nYou will receive another email once your booking has been approved.\n\nBest regards,\nCRRS System`;

  addSheetsEntry({
    type: 'email',
    action: 'Submission confirmation auto-sent',
    to: booking.userEmail,
    subject: `[CRRS] 📋 Booking Received: ${booking.title} – ${booking.date}`,
    room: booking.roomName,
    user: booking.userName,
    date: booking.date,
    body: emailBody
  });
}

// ─── ADMIN BOOKINGS ───────────────────────────────────────────────────────────
function AdminBookings({ bookings, setBookings, users, showToast, addSheetsEntry }) {
  const [filter, setFilter] = useState('all');
  const approve = (id) => {
    setBookings(prev => prev.map(b => b.id === id ? { ...b, status: 'confirmed' } : b));
    const b = bookings.find(b => b.id === id);
    const emailBody = `Dear ${b?.userName},\n\nGreat news! Your conference room reservation has been APPROVED.\n\nReservation Details:\n• Meeting: ${b?.title}\n• Room: ${b?.roomName}\n• Date: ${b?.date}\n• Time: ${b?.startTime} – ${b?.endTime}\n\nPlease arrive a few minutes early to set up.\n\nBest regards,\nCRRS Administration`;
    addSheetsEntry({ type: 'email', action: 'Approval email auto-sent', to: b?.userEmail, subject: `[CRRS] ✅ Booking Approved: ${b?.title} – ${b?.date}`, room: b?.roomName, user: b?.userName, date: b?.date, body: emailBody });
    showToast(`Booking approved — confirmation email auto-sent to ${b?.userEmail}`);
  };
  const cancel = (id) => {
    setBookings(prev => prev.map(b => b.id === id ? { ...b, status: 'cancelled' } : b));
    showToast('Booking cancelled');
  };
  const resend = (b) => {
    addSheetsEntry({ type: 'email', action: 'Email resent', to: b.userEmail, subject: `[CRRS] Reminder: ${b.title} on ${b.date}`, room: b.roomName, user: b.userName, date: b.date, body: `Reminder: Your meeting "${b.title}" is scheduled on ${b.date} from ${b.startTime} to ${b.endTime} in ${b.roomName}.\n\nCRRS System` });
    showToast(`Reminder email resent to ${b.userEmail}`);
  };
  const filtered = [...(filter === 'all' ? bookings : bookings.filter(b => b.status === filter))].sort((a, b) => (b.date > a.date ? 1 : b.date < a.date ? -1 : 0));
  return h('div', null,
    h('div', { className: 'table-wrap' },
      h('div', { className: 'table-head' },
        h('span', { style: { fontWeight: 600, fontSize: 14 } }, `${filtered.length} booking(s)`),
        h('div', { style: { display: 'flex', gap: 6 } },
          ['all','pending','confirmed','cancelled'].map(f => h('button', { key: f, className: `btn-sm${filter===f?' accent':''}`, onClick: () => setFilter(f), style: { textTransform: 'capitalize', height: 28, padding: '0 10px', fontSize: 11 } }, f))
        )
      ),
      filtered.length === 0 ? h('div', { className: 'select-prompt' }, h('p', null, 'No bookings found.')) :
      h('table', null,
        h('thead', null, h('tr', null, ['Room', 'Meeting', 'Organizer', 'Date', 'Time', 'Status', 'Actions'].map(c => h('th', { key: c }, c)))),
        h('tbody', null, filtered.map(b =>
          h('tr', { key: b.id },
            h('td', null, h('span', null, b.roomName), h('span', { className: `tag tag-${b.roomType}` }, b.roomType)),
            h('td', null, h('span', { style: { fontWeight: 500, fontSize: 12 } }, b.title)),
            h('td', null, h('div', { style: { fontSize: 12 } }, b.userName), h('div', { style: { fontSize: 10, color: 'var(--text-muted)' } }, b.userEmail)),
            h('td', null, formatDate(b.date)),
            h('td', null, `${b.startTime}–${b.endTime}`),
            h('td', null, h('span', { className: `status-pill status-${b.status}` }, b.status)),
            h('td', null, h('div', { className: 'action-btns' },
              b.status === 'pending' && h('button', { className: 'act-btn app', onClick: () => approve(b.id) }, '✓ Approve'),
              b.status !== 'cancelled' && h('button', { className: 'act-btn del', onClick: () => cancel(b.id) }, 'Cancel'),
              h('button', { className: 'act-btn email', onClick: () => resend(b) }, '📧')
            ))
          )
        ))
      )
    )
  );
}

// ─── MANAGE USERS ─────────────────────────────────────────────────────────────
function ManageUsers({ users, setUsers, currentUser, showToast }) {
  const [showAdd, setShowAdd] = useState(false);
  const [form, setForm] = useState({ name: '', email: '', password: '', role: 'user', securityQuestion: '', securityAnswer: '' });
  const [error, setError] = useState('');

  const addUser = () => {
    setError('');
    if (!form.name || !form.email || !form.password) { setError('Name, email and password are required.'); return; }
    if (!form.securityQuestion || !form.securityAnswer) { setError('Security question and answer are required.'); return; }
    if (users.find(u => u.email === form.email)) { setError('A user with this email already exists.'); return; }
    const newUser = { id: Date.now(), name: form.name, email: form.email, password: form.password, role: form.role, securityQuestion: form.securityQuestion, securityAnswer: form.securityAnswer };
    setUsers(prev => [...prev, newUser]);
    setForm({ name: '', email: '', password: '', role: 'user', securityQuestion: '', securityAnswer: '' });
    setShowAdd(false);
    showToast(`User "${newUser.name}" added successfully`);
  };

  const promoteUser = (id) => {
    setUsers(prev => prev.map(u => u.id === id ? { ...u, role: 'admin' } : u));
    const u = users.find(u => u.id === id);
    showToast(`${u?.name} promoted to Admin`);
  };

  const demoteUser = (id) => {
    if (id === currentUser.id) { showToast('You cannot demote yourself'); return; }
    setUsers(prev => prev.map(u => u.id === id ? { ...u, role: 'user' } : u));
    const u = users.find(u => u.id === id);
    showToast(`${u?.name} demoted to User`);
  };

  const removeUser = (id) => {
    if (id === currentUser.id) { showToast('You cannot remove yourself'); return; }
    setUsers(prev => prev.filter(u => u.id !== id));
    showToast('User removed');
  };

  return h('div', null,
    h('div', { style: { display: 'flex', justifyContent: 'flex-end', marginBottom: '1rem' } },
      h('button', { className: 'btn-sm accent', onClick: () => setShowAdd(!showAdd) }, '+ Add User')
    ),
    showAdd && h('div', { className: 'booking-panel', style: { marginBottom: '1.5rem' } },
      h('div', { className: 'section-title' }, 'Add New User'),
      error && h('div', { className: 'error-msg' }, error),
      h('div', { className: 'form-grid' },
        h('div', { className: 'form-field' },
          h('label', null, 'Full Name'),
          h('input', { type: 'text', placeholder: 'Juan dela Cruz', value: form.name, onChange: e => setForm(f => ({ ...f, name: e.target.value })) })
        ),
        h('div', { className: 'form-field' },
          h('label', null, 'Email'),
          h('input', { type: 'email', placeholder: 'juan@company.com', value: form.email, onChange: e => setForm(f => ({ ...f, email: e.target.value })) })
        ),
        h('div', { className: 'form-field' },
          h('label', null, 'Password'),
          h('input', { type: 'password', placeholder: '••••••••', value: form.password, onChange: e => setForm(f => ({ ...f, password: e.target.value })) })
        ),
        h('div', { className: 'form-field' },
          h('label', null, 'Role'),
          h('select', { value: form.role, onChange: e => setForm(f => ({ ...f, role: e.target.value })) },
            h('option', { value: 'user' }, 'User'),
            h('option', { value: 'admin' }, 'Admin')
          )
        ),
        h('div', { className: 'form-field full' },
          h('label', null, 'Security Question'),
          h('select', { value: form.securityQuestion, onChange: e => setForm(f => ({ ...f, securityQuestion: e.target.value })) },
            h('option', { value: '' }, '— Select a question —'),
            h('option', { value: "What is your mother's maiden name?" }, "What is your mother's maiden name?"),
            h('option', { value: "What was the name of your first pet?" }, "What was the name of your first pet?"),
            h('option', { value: "What city were you born in?" }, "What city were you born in?"),
            h('option', { value: "What is the name of your elementary school?" }, "What is the name of your elementary school?"),
            h('option', { value: "What was your childhood nickname?" }, "What was your childhood nickname?"),
            h('option', { value: "What is your favorite food?" }, "What is your favorite food?")
          )
        ),
        h('div', { className: 'form-field full' },
          h('label', null, 'Security Answer'),
          h('input', { type: 'text', placeholder: 'Your answer (case-insensitive)', value: form.securityAnswer, onChange: e => setForm(f => ({ ...f, securityAnswer: e.target.value })) })
        )
      ),
      h('div', { className: 'form-actions' },
        h('button', { className: 'btn-cancel', onClick: () => { setShowAdd(false); setError(''); } }, 'Cancel'),
        h('button', { className: 'btn-submit', onClick: addUser }, '✓ Add User')
      )
    ),
    h('div', { className: 'table-wrap' },
      h('div', { className: 'table-head' }, h('span', { style: { fontWeight: 600, fontSize: 14 } }, `${users.length} user(s)`)),
      h('table', { className: 'user-table', style: { tableLayout: 'fixed', width: '100%' } },
        h('thead', null, h('tr', null,
          h('th', { style: { width: 'auto' } }, 'User'),
          h('th', { style: { width: 110 } }, 'Role'),
          h('th', { style: { width: 200 } }, 'Actions')
        )),
        h('tbody', null, users.map(u => h('tr', { key: u.id },
          h('td', null, h('div', { style: { display: 'flex', alignItems: 'center', gap: 10 } },
            h('div', { style: { width: 34, height: 34, borderRadius: '50%', background: u.role === 'admin' ? '#1a3a5c' : '#2a6496', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#fff', fontSize: 12, fontWeight: 700, flexShrink: 0 } },
              u.name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2)
            ),
            h('div', null,
              h('div', { style: { fontSize: 13, fontWeight: 600, display: 'flex', alignItems: 'center', gap: 6 } },
                u.name,
                u.id === currentUser.id && h('span', { style: { fontSize: 10, background: '#e8f0f8', color: '#1a3a5c', padding: '2px 6px', borderRadius: 8, fontWeight: 600 } }, 'YOU')
              ),
              h('div', { style: { fontSize: 11, color: 'var(--text-muted)', marginTop: 1 } }, u.email)
            )
          )),
          h('td', null, h('span', { className: `status-pill ${u.role === 'admin' ? 'status-confirmed' : 'status-pending'}` }, u.role === 'admin' ? '👑 Admin' : '👤 User')),
          h('td', { style: { width: 200 } }, h('div', { className: 'action-btns', style: { minWidth: 180 } },
            u.role === 'user' && h('button', { className: 'act-btn app', onClick: () => promoteUser(u.id) }, '▲ Promote to Admin'),
            u.role === 'admin' && u.id !== currentUser.id && h('button', { className: 'act-btn email', onClick: () => demoteUser(u.id) }, '▼ Demote'),
            u.id !== currentUser.id && h('button', { className: 'act-btn del', onClick: () => removeUser(u.id) }, 'Remove')
          ))
        )))
      )
    )
  );
}
