                        <button className="btn btn-sm" onClick={() => setEmailModal(r)} title="Send email">✉</button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {emailModal && (
        <EmailModal res={emailModal} onClose={() => setEmailModal(null)} toast={toast} />
      )}
    </div>
  );
}

// ─── EMAIL MODAL ───
function EmailModal({ res, onClose, toast }) {
  const [subject, setSubject] = useState(`Regarding your reservation – ${res.room_name}`);
  const [body, setBody] = useState(`Dear ${res.user_full_name},\n\nThis is a message regarding your reservation for ${res.room_name} on ${res.date}.\n\nBest regards,\nRoom Booking Admin`);
  const [sending, setSending] = useState(false);

  const send = async () => {
    setSending(true);
    try {
      await sendEmail({ to: res.user_email, toName: res.user_full_name, subject, body });
      toast(`Email sent to ${res.user_email}`, 'success');
      onClose();
    } catch (e) { toast('Failed to send email.', 'error'); }
    setSending(false);
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-title">✉ Send Email</div>
        <div className="modal-sub">To: {res.user_full_name} &lt;{res.user_email}&gt;</div>
        <div className="form-field" style={{marginBottom:'1rem'}}>
          <label className="form-label">Subject</label>
          <input className="form-input" value={subject} onChange={e => setSubject(e.target.value)} />
        </div>
        <div className="form-field">
          <label className="form-label">Message</label>
          <textarea className="form-input" rows={7} value={body} onChange={e => setBody(e.target.value)} style={{resize:'vertical'}} />
        </div>
        <div className="modal-actions">
          <button className="btn" onClick={onClose}>Cancel</button>
          <button className="btn btn-navy" onClick={send} disabled={sending}>
            {sending ? <><span className="spinner" style={{borderTopColor:'#fff'}} /> Sending…</> : '✉ Send Email'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── MAIN APP ───
function App() {
  const { toasts, add: toast, remove: removeToast } = useToast();
  const [currentUser, setCurrentUser] = useState(null);
  const [activeTab, setActiveTab] = useState('book');
  const [refreshKey, setRefreshKey] = useState(0);

  // Always use the two hardcoded rooms
  const rooms = HARDCODED_ROOMS;

  const logout = () => {
    if (supabase) supabase.auth.signOut();
    if (currentUser) releaseDbSession(currentUser.id);
    clearStoredCredentials();
    setCurrentUser(null);
    toast('Signed out. Your session has been released.', 'info');
  };

  // Keep the DB-backed session "alive" so it isn't reclaimed as stale while genuinely in use.
  useEffect(() => {
    if (!currentUser) return;
    const interval = setInterval(() => heartbeatDbSession(currentUser.id), DB_SESSION_HEARTBEAT_MS);
    return () => clearInterval(interval);
  }, [currentUser]);

  // Continuously check the database for any user/admin whose session has gone silent
  // for 15+ minutes and auto-remove (log out) that stale session — independent of
  // whether anyone is trying to log back in. Runs regardless of who is currently
  // signed in, including before any login on this device.
  useEffect(() => {
    sweepStaleSessions();
    const interval = setInterval(sweepStaleSessions, DB_SESSION_SWEEP_MS);
    return () => clearInterval(interval);
  }, []);

  // Reliably flip is_active back to false even if the tab/browser is closed, refreshed,
  // or crashes without the user ever clicking "Sign Out". 'pagehide' fires on real
  // navigation-away/close (including mobile, more reliably than 'beforeunload' alone) and
  // triggers a keepalive fetch designed to survive the page tearing down. Merely switching
  // tabs/apps ('visibilitychange' → hidden) is NOT treated as closing — it just sends one
  // extra heartbeat, since background tabs can get their timers throttled; if the tab never
  // comes back, the short server-side stale timeout is the final safety net.
  useEffect(() => {
    if (!currentUser) return;
    const release = () => {
      releaseDbSessionBeacon(currentUser.id, currentUser.accessToken);
    };
    const onVisibilityChange = () => { if (document.visibilityState === 'hidden') heartbeatDbSession(currentUser.id); };
    window.addEventListener('pagehide', release);
    window.addEventListener('beforeunload', release);
    document.addEventListener('visibilitychange', onVisibilityChange);
    return () => {
      window.removeEventListener('pagehide', release);
      window.removeEventListener('beforeunload', release);
      document.removeEventListener('visibilitychange', onVisibilityChange);
    };
  }, [currentUser]);

  if (!currentUser) {
    return (
      <>
        <LoginScreen onLogin={setCurrentUser} toast={toast} />
        <ToastContainer toasts={toasts} remove={removeToast} />
      </>
    );
  }

  const isAdmin = currentUser.role === 'admin';
  const initials = currentUser.fullName.split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2);

  const navItems = [
    { key: 'book', icon: '📅', label: 'Book a Room', adminOnly: false },
    { key: 'schedule', icon: '🗓️', label: 'Room Schedule', adminOnly: false },
    { key: 'my', icon: '📋', label: 'My Reservations', adminOnly: false },
    ...(isAdmin ? [{ key: 'admin', icon: '⚙️', label: 'Admin Panel', adminOnly: true }] : []),
  ];

  const pageInfo = {
    book: { title: 'Book a Room', sub: 'Select a room and submit your reservation' },
    schedule: { title: 'Room Schedule', sub: 'See every booked slot, who reserved it, and when rooms are occupied' },
    my: { title: 'My Reservations', sub: 'Track the status of your bookings' },
    admin: { title: 'Admin Panel', sub: 'Review and manage all reservation requests' },
  };

  return (
    <>
      <div className="app-shell">
        <div className="sidebar">
          <div className="sidebar-header">
            <div className="sidebar-logo">
              <div className="sl-icon"><img src={LOGO_SRC} alt="Logo" /></div>
              <div className="sl-text"><h2>CRRS</h2><p>Conference Room Reservation</p></div>
            </div>
          </div>
          <div className="sidebar-nav">
            <div className="nav-group-label">Navigation</div>
            {navItems.map(item => (
              <button key={item.key} className={`nav-item ${activeTab === item.key ? 'active' : ''}`} onClick={() => setActiveTab(item.key)}>
                <span className="ni">{item.icon}</span>
                {item.label}
              </button>
            ))}
          </div>
          <div className="sidebar-footer">
            <div className="user-chip">
              <div className="uc-av">{initials}</div>
              <div className="uc-info"><p>{currentUser.fullName}</p><span>{isAdmin ? 'Administrator' : 'Staff'}</span></div>
            </div>
            <button className="logout-btn" onClick={logout}>⬅ Sign Out</button>
          </div>
        </div>

        <div className="main-area">
          <div className="topbar">
            <div>
              <div className="topbar-title">{pageInfo[activeTab]?.title}</div>
              <div className="topbar-sub">{pageInfo[activeTab]?.sub}</div>
            </div>
            <div className="topbar-right">
              {isAdmin && <span style={{fontSize:11,background:'#e8f3fb',color:'var(--navy)',padding:'3px 10px',borderRadius:20,fontWeight:600}}>ADMIN</span>}
              <span style={{fontSize:12,color:'var(--text-muted)'}}>{new Date().toLocaleDateString('en-PH',{weekday:'short',month:'short',day:'numeric'})}</span>
            </div>
          </div>

          <div className="content-area">
            {activeTab === 'book' && (
              <BookingForm key={refreshKey} currentUser={currentUser} rooms={rooms} toast={toast}
                onBooked={() => { setRefreshKey(k => k+1); setActiveTab('my'); }} />
            )}
            {activeTab === 'schedule' && <RoomSchedule key={'sched'+refreshKey} rooms={rooms} toast={toast} isAdmin={isAdmin} />}
            {activeTab === 'my' && <MyReservations key={refreshKey} currentUser={currentUser} toast={toast} rooms={rooms} />}
            {activeTab === 'admin' && isAdmin && <AdminPanel toast={toast} />}
          </div>
        </div>
      </div>
      <ToastContainer toasts={toasts} remove={removeToast} />
    </>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
